  const bx0 = hasR ? bk[0] : n.x, bz0 = hasR ? bk[1] : n.z, gyN = hasR ? gyB : gy;
  /* —— 事件伏笔：地标由 data.js 的 icon 决定，与 2D 共用同一份节点 —— */
  if (ic === 'bridge') {                         // 飞夺泸定桥：铁索桥横跨大渡河
    const br = (ri ? ri.dir : rot) + Math.PI / 2;
    const len = ri ? 2 * (ri.hw + ri.bw * 0.5) + 12 : 24;
    vhchainbridge({ x: n.x, y: wY - 0.6, z: n.z, rot: br, len, w: 3.4 });
    vhhouse({ x: bk[0], y: gyB, z: bk[1], rot: br, w: bw, d: bd, h: bh, wall: reg.wall, roof: reg.roof });
  } else if (ic === 'ford') {                    // 于都河 / 金沙江 / 江界河 夜渡
    vhboat({ x: n.x + 2, y: wY - .3, z: n.z, rot, s: 1.2 });
    vhboat({ x: n.x - 3, y: wY - .3, z: n.z + 2, rot: rot + .3, s: 1.0 });
    vhhouse({ x: bk[0], y: gyB, z: bk[1], rot, w: bw, d: bd, h: bh, wall: reg.wall, roof: reg.roof, stilt: reg.stilt });
  } else if (ic === 'river' || (ic === 'battle' && hasR)) {  // 湘江 / 大渡河 强渡
    vhboat({ x: n.x + 3, y: wY - .3, z: n.z, rot, s: 1.4 });
    vhboat({ x: n.x - 2, y: wY - .3, z: n.z - 3, rot: rot + .4, s: 1.2 });
    vhgate({ x: bk[0], y: gyB, z: bk[1], rot, w: 9 * BS, d: 3.6 * BS, h: 5 * BS });
  } else if (ic === 'fork') {                    // 四渡赤水：一江四渡，四个渡口同时立着
    const dr = ri ? ri.dir : rot;
    for (let t = 0; t < 4; t++) {
      const off = (t - 1.5) * 11 * BS;
      const px = n.x + Math.cos(dr) * off, pz = n.z + Math.sin(dr) * off;
      vhboat({ x: px + 2.5, y: wY - .3, z: pz, rot: dr + 1.57, s: 1.0 + t * .1 });
      clrXF();
      /* 渡口房屋落到干岸（而非浮在水面 wY），否则一江四渡的房子全立在水里 */
      const fk = ri ? toBank(px, pz, ri) : [px, pz];
      const fy = surfaceY(fk[0], fk[1]) + .06;
      vhbox(fk[0] - 1.4, fy, fk[1] - 2.4, fk[0] + 1.4, fy + .9, fk[1] + 2.4, [.40, .31, .22], .9);
    }
    vhtower({ x: bk[0], y: gyB, z: bk[1], rot, w: 3.2 * BS, d: 3.2 * BS, floors: 2 });
    const fkx = bk[0] - Math.cos(rot) * 7 * BS, fkz = bk[1] - Math.sin(rot) * 7 * BS;
    /* fork 偏移房：原样落到河对岸水里→整栋省略(omit)。改为就近环扫 30 半径找干岸，
       找到就落在干地上（按落点地面重算 y，绝不漂浮）；仍无干地才就近退到节点基座干岸。 */
    const fdp = nearestDry(fkx, fkz, 2.5, 30) || nearestDry(bk[0], bk[1], 2.5, 14);
    if (fdp) vhhouse({ x: fdp[0], y: surfaceY(fdp[0], fdp[1]) + .06, z: fdp[1], rot, w: bw, d: bd, h: bh, wall: reg.wall, roof: reg.roof, stilt: reg.stilt });
  } else if (ic === 'snow') {                    // 夹金山
    vhgate({ x: bx0, y: gyN, z: bz0, rot, w: 9 * BS, d: 3.6 * BS, h: 5.6 * BS });
  } else if (ic === 'swamp') {                   // 草地·班佑河
    vhboat({ x: n.x, y: wY - .3, z: n.z, rot, s: 1.2 });
    for (let t = 0; t < 5; t++) {
      const a = t / 5 * 6.28, tx = bk[0] + Math.cos(a) * 7 * BS, tz = bk[1] + Math.sin(a) * 7 * BS;
      const dp = dryOrNull(tx, tz, bk[0], bk[1], 1.4);   /* 帐篷不落进班佑河 */
      if (!dp) continue;
      vhtent({ x: dp[0], y: surfaceY(dp[0], dp[1]) + .06, z: dp[1], rot: a });
    }
  } else if (ic === 'granary') {                 // 崔古仓开仓
    vhgranary({ x: bx0, y: gyN, z: bz0, rot });
  } else if (ic === 'hall') {                    // 遵义会议 / 两河口
    vhhall({ x: bx0, y: gyN, z: bz0, rot });
  } else if (ic === 'alliance') {                // 彝海结盟：湖在小，房在岸
    vhlake({ x: n.x, y: gy, z: n.z, r: 9 });
    /* 房子挪到湖岸高地：在节点四周 13 单位处挑一块最高的干岸，不立在水里 */
    let ak = [n.x, n.z], aky = -1e9;
    for (let a = 0; a < 6.28; a += 0.5) {
      const X = n.x + Math.cos(a) * 13, Z = n.z + Math.sin(a) * 13;
      const h = surfaceY(X, Z);
      if (h > aky) { aky = h; ak = [X, Z]; }
    }
    vhhouse({ x: ak[0], y: surfaceY(ak[0], ak[1]) + .06, z: ak[1], rot, w: bw, d: bd, h: bh, wall: reg.wall, roof: reg.roof });
  } else if (ic === 'pass') {                    // 腊子口
    vhgate({ x: bx0, y: gyN, z: bz0, rot, w: 9 * BS, d: 3.6 * BS, h: 5 * BS });
    for (const sd of [1, -1]) {
      const tx = bx0 + Math.cos(rot + 1.57) * 7 * BS * sd, tz = bz0 + Math.sin(rot + 1.57) * 7 * BS * sd;
      vhtower({ x: tx, y: surfaceY(tx, tz) + .06, z: tz, rot, w: 3.2 * BS, d: 3.2 * BS, floors: 2 });
    }
  } else if (ic === 'end') {                     // 吴起镇
    vhcluster(bx0, gyN, bz0, rot, 8, BS, true, ruinRate);
  } else if (ic === 'mountain') {                // 雪山脚 / 娄山关 / 彝族山寨
    vhgate({ x: bx0, y: gyN, z: bz0, rot, w: 8 * BS, d: 3.4 * BS, h: 4.6 * BS });
  } else if (ic === 'village' || ic === 'camp' || ic === 'news' || ic === 'checkpoint') {
    vhcluster(bx0, gyN, bz0, rot, 6, BS, ic === 'village', ruinRate);
  } else if (ic === 'city' || ic === 'shop' || ic === 'road' || ic === 'hq') {
    vhcluster(bx0, gyN, bz0, rot, 9, BS, true, ruinRate);
  } else {                                       // '?' / none：地域聚落（藏碉 / 窑洞 / 吊脚楼 / 帐篷 / 普通）
    buildRegionSettlement({ x: bx0, z: bz0 }, gyN, rot, reg, BS, bw, bd, bh);
  }
  /* 血战伏笔：湘江/二渡赤水/安顺场全量阵地，强渡渡口与关隘桥头留半量痕迹 */
  if (bf > 0) buildBattlefield(n, gy, rot, BS, 20261107 + idx * 31, bf);
  /* 地域植被：草地段只长水草，不长乔木 —— 望不到边的草地不该有松林 */
  const treeType = pickTreeType(n.x, n.z);
  if (treeType) { const tc = 4 + (RNG() * 3 | 0);
    for (let i = 0; i < tc; i++) { const a = RNG() * 6.28, r = 18 + RNG() * 15;
      const x = n.x + Math.cos(a) * r, z = n.z + Math.sin(a) * r;
      vhtree(treeType, x, surfaceY(x, z), z, 1.1 + RNG() * 0.5); } }
  /* 节点信标挪到聚落外侧路边：以前正插在会址/关隘/粮仓中心，跟房子长在一起 */
  const sx2 = n.x + Math.cos(rot) * 16 * BS, sz2 = n.z + Math.sin(rot) * 16 * BS;
  const gyS = surfaceY(sx2, sz2) + .06;
  const by = hasR ? Math.max(gyS, wY + 0.35) : gyS;   /* 柱子按自己脚下落地，只有真泡在水里才抬出水面 */
  const gateSign = n.kind === 'gate';
  const postH = (gateSign ? 3.7 : 2.4) * BS;
  vhbox(sx2 - .22 * BS, by, sz2 - .22 * BS, sx2 + .22 * BS, by + postH, sz2 + .22 * BS, [.64, .20, .16], .95);
  vhbox(sx2 - .55 * BS, by - .2, sz2 - .55 * BS, sx2 + .55 * BS, by + .4, sz2 + .55 * BS, MAT.stoneD, .8);
  if (gateSign) {
    /* 大事节点（gate）加一块无字木牌：比统一的小红柱更有地标剪影，
       也遵守地图规范「节点只用木牌与矮石堆」——不写字、不插旗。 */
    setXF(sx2, by, sz2, rot + Math.PI / 2);
    vhbox(-1.15 * BS, postH * .66, -.13 * BS, 1.15 * BS, postH * .78, .13 * BS, [.51, .35, .21], .95);
    vhbox(-1.15 * BS, postH * .64, -.15 * BS, 1.15 * BS, postH * .66, .15 * BS, [.34, .23, .15], .9);
    clrXF();
  }
  RNG = saveR;
  const solid = V.slice(0, VW);
  /* 硝烟单独一份 VBO：半透明、不写深度，跟不透明阵地分开画 */
  vreset();
  if (bf > 0) buildSmokeField(n, gy, rot, BS, 20261107 + idx * 31, bf);
  return { solid, smoke: V.slice(0, VW) };
}

/* ---------- 红线：分段建带，跟着地形台阶走 ---------- */
const ROADCOL = [.88, .30, .21];
let RSEGS = [];
function buildRoute() {
  const SPANP = 24;
  RSEGS = [];
  const earth = [.56, .42, .29], earthD = [.42, .30, .20], earthB = [.27, .20, .15];
  for (let s0 = 0; s0 < ROUTE.length - 1; s0 += SPANP) {
    vreset();
    const s1 = Math.min(ROUTE.length - 1, s0 + SPANP);
    for (let i = s0; i < s1; i += 2) {
      const a = ROUTE[i], b = ROUTE[Math.min(i + 2, ROUTE.length - 1)];
      const dx = b[0] - a[0], dz = b[1] - a[1], L = Math.hypot(dx, dz) || 1;
      const tx = dx / L, tz = dz / L, nx = -tz, nz = tx;
      const ha = surfaceY(a[0], a[1]) + .30, hb = surfaceY(b[0], b[1]) + .30;
      const wB = 2.65, wO = 2.15, wM = 1.25, wI = 0.40;
      /* 外圈深土路肩 → 中间踩实浅土 → 一道红土中心标线：写实土路/栈道质感 */
      pushQuad([a[0] + nx * wB, ha - .02, a[1] + nz * wB], [b[0] + nx * wB, hb - .02, b[1] + nz * wB],
               [b[0] - nx * wB, hb - .02, b[1] - nz * wB], [a[0] - nx * wB, ha - .02, a[1] - nz * wB], earthB, [0, 1, 0]);
      pushQuad([a[0] + nx * wO, ha, a[1] + nz * wO], [b[0] + nx * wO, hb, b[1] + nz * wO],
               [b[0] - nx * wO, hb, b[1] - nz * wO], [a[0] - nx * wO, ha, a[1] - nz * wO], earthD, [0, 1, 0]);
      pushQuad([a[0] + nx * wM, ha + .03, a[1] + nz * wM], [b[0] + nx * wM, hb + .03, b[1] + nz * wM],
               [b[0] - nx * wM, hb + .03, b[1] - nz * wM], [a[0] - nx * wM, ha + .03, a[1] - nz * wM], earth, [0, 1, 0]);
      pushQuad([a[0] + nx * wI, ha + .06, a[1] + nz * wI], [b[0] + nx * wI, hb + .06, b[1] + nz * wI],
               [b[0] - nx * wI, hb + .06, b[1] - nz * wI], [a[0] - nx * wI, ha + .06, a[1] - nz * wI], ROADCOL, [0, 1, 0]);
    }
    /* 前进箭头：俯瞰缩小时红线只有一两个像素，箭头仍然能说明长征方向。 */
    if ((s0 / SPANP) % 2 === 0 && ROUTE.length > 3) {
      const ai = Math.min(ROUTE.length - 2, s0 + 11);
      const ap = ROUTE[ai], bp = ROUTE[Math.min(ROUTE.length - 1, ai + 2)];
      let ax = bp[0] - ap[0], az = bp[1] - ap[1]; const al = Math.hypot(ax, az) || 1; ax /= al; az /= al;
      const anx = -az, anz = ax, ay = surfaceY(ap[0], ap[1]) + .115;
      const tip = [ap[0] + ax * 1.55, ay, ap[1] + az * 1.55];
      const lft = [ap[0] - ax * .55 + anx * .92, ay, ap[1] - az * .55 + anz * .92];
      const rgt = [ap[0] - ax * .55 - anx * .92, ay, ap[1] - az * .55 - anz * .92];
      pushTri(tip, lft, rgt, ROADCOL, ROADCOL, ROADCOL, [0, 1, 0], [0, 1, 0], [0, 1, 0]);
    }
    RSEGS.push({ x: (ROUTE[s0][0] + ROUTE[s1][0]) / 2, z: (ROUTE[s0][1] + ROUTE[s1][1]) / 2,
      data: V.slice(0, VW), count: vCount, vao: null, vbo: null });
  }
  vreset();
}

/* 俯瞰远景：整张地图一块粗粒度网格，相机很远时只画它（单 draw call），
   既满足「远山溶进雾里」，又不必为全景铺满几千个细块——省内存也省电。 */
function buildFarMesh(cell) {
  vreset();
  const nx = Math.ceil(WORLD_X / cell), nz = Math.ceil(WORLD_Y / cell);
  const HH = new Float32Array((nx + 1) * (nz + 1));
  for (let j = 0; j <= nz; j++) for (let i = 0; i <= nx; i++)
    HH[j * (nx + 1) + i] = Math.max(1.5, sampleH(-HALFX + i * cell, -HALFZ + j * cell));
  /* 远景同样走平滑曲面：俯瞰时不再是一层层巨型石板 */
  emitSmoothSurf(HH, nx + 1, -HALFX, -HALFZ, cell, nx, nz, (h, slope, x, z) => voxColor(h, slope, x, z));
  const A = (i, j) => HH[clamp(j, 0, nz) * (nx + 1) + clamp(i, 0, nx)];
  /* 四周裙边：把整张图做成一块有厚度的地台，而不是漂着的一张纸 */
  const BASE = -70, DM = [.30, .28, .25];
  const wall = (p0, p1, h0, h1, nr) => pushQuad4([p0[0], h0, p0[1]], [p1[0], h1, p1[1]],
    [p1[0], BASE, p1[1]], [p0[0], BASE, p0[1]],
    mix(DM, [.38, .35, .31], .5), mix(DM, [.26, .24, .22], .5), DM, DM, nr);
  for (let i = 0; i < nx; i++) {
    wall([-HALFX + i * cell, -HALFZ], [-HALFX + (i + 1) * cell, -HALFZ], A(i, 0), A(i + 1, 0), [0, 0, -1]);
    wall([-HALFX + (i + 1) * cell, -HALFZ + nz * cell], [-HALFX + i * cell, -HALFZ + nz * cell], A(i + 1, nz), A(i, nz), [0, 0, 1]);
  }
  for (let j = 0; j < nz; j++) {
    wall([-HALFX, -HALFZ + (j + 1) * cell], [-HALFX, -HALFZ + j * cell], A(0, j + 1), A(0, j), [-1, 0, 0]);
    wall([-HALFX + nx * cell, -HALFZ + j * cell], [-HALFX + nx * cell, -HALFZ + (j + 1) * cell], A(nx, j), A(nx, j + 1), [1, 0, 0]);
  }
  return { data: V.slice(0, VW), count: vCount };
}

/* ---------- 极简矩阵（列主序） ---------- */
function perspective(fovy, asp, near, far) {
  const f = 1 / Math.tan(fovy / 2), o = new Float32Array(16);
  o[0] = f / asp; o[5] = f; o[10] = (far + near) / (near - far); o[11] = -1;
  o[14] = 2 * far * near / (near - far); return o;
}
function lookAt(eye, at, up) {
  const norm = v => { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0]/l, v[1]/l, v[2]/l]; };
  const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
  const dot = (a, b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
  const z = norm([eye[0]-at[0], eye[1]-at[1], eye[2]-at[2]]);
  const x = norm(cross(up, z)), y = cross(z, x);
  return new Float32Array([x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0, -dot(x,eye), -dot(y,eye), -dot(z,eye), 1]);
}
function mul(a, b) {
  const o = new Float32Array(16);
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) for (let k = 0; k < 4; k++) o[c*4+r] += a[k*4+r] * b[c*4+k];
  return o;
}

/* ---------- WebGL 着色器 ---------- */
const VS_MAIN = `#version 300 es
layout(location=0) in vec3 aPos; layout(location=1) in vec3 aNormal; layout(location=2) in vec3 aColor;
uniform mat4 uVP;
out vec3 vColor; out vec3 vNormal; out vec3 vWorld;
void main(){ gl_Position=uVP*vec4(aPos,1.0); vColor=aColor; vNormal=aNormal; vWorld=aPos; }`;
/* 光照：方向光 + 天光半球 + 距离雾 + 谷底云海。
   以前只有 (0.58+0.42d) 一项，暗面全靠环境兜，所以整片发灰；现在阳面有日色、阴面有天光蓝。 */
const FS_MAIN = `#version 300 es
precision highp float;
in vec3 vColor; in vec3 vNormal; in vec3 vWorld;
uniform vec3 uCam,uFog,uLightDir,uSunCol,uSkyCol;
uniform float uFogD,uFogY,uFogH,uCloud,uSat,uExp,uTime;
uniform vec2 uRes; uniform float uAlpha;
out vec4 outColor;
float hash21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float vnoise21(vec2 p){
  vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
  return mix(mix(hash21(i),hash21(i+vec2(1.0,0.0)),f.x),
             mix(hash21(i+vec2(0.0,1.0)),hash21(i+vec2(1.0,1.0)),f.x),f.y);
}
void main(){
  vec3 n=normalize(vNormal);
  vec3 Ld=normalize(uLightDir);
  float ndl=dot(n,Ld);
  float wrap=ndl*0.5+0.5;                        // 半兰伯特：阴面不死黑，有天光过渡
  float sky=0.5+0.5*n.y;                         // 上向接天光、下向接地面反弹
  vec3 ground=vec3(0.20,0.16,0.13);              // 暖色地面反弹，阴面不发灰
  vec3 amb=uSkyCol*(0.40+0.34*sky)+ground*(0.20*(1.0-sky));
  vec3 c=vColor*(uSunCol*clamp(wrap,0.0,1.0)*1.02+amb);
  /* 厚云投下的斑驳阴影：用世界坐标算，不随 LOD 变，大片山体才有明暗起伏 */
  float cs=sin(vWorld.x*0.019+uTime*0.05)*sin(vWorld.z*0.023-uTime*0.04)
          +0.5*sin(vWorld.x*0.051-vWorld.z*0.043+1.7);
  c*=1.0-uCloud*0.12*(0.5+0.5*cs);
  /* 去饱和 + 曝光：把明快的观光色压成苍凉色 */
  float l=dot(c,vec3(0.299,0.587,0.114));
  c=mix(vec3(l),c,uSat)*uExp;
  float d=length(vWorld-uCam);
  /* 片元级微表面：顶点色只到 LOD 格距，近看会像塑料。这里叠世界坐标噪声与
     岩层横纹，远距离自动淡出，既保留低多边形轮廓，又补足草土石颗粒。 */
  float detailFade=1.0-smoothstep(55.0,260.0,d);
  float steep=1.0-clamp(n.y,0.0,1.0);
  float green=smoothstep(0.005,0.16,c.g-c.r);
  float micro=vnoise21(vWorld.xz*0.62+vWorld.y*0.11)-0.5;
  float fine=vnoise21(vWorld.xz*2.55-vWorld.y*0.23)-0.5;
  float band=sin(vWorld.y*1.45+vnoise21(vWorld.xz*0.085)*3.4);
  c*=1.0+detailFade*(micro*(0.090+0.070*green)+fine*(0.022+0.050*steep)-band*steep*0.045);
  float f=1.0-exp(-pow(d/uFogD,1.55));
  float hf=exp(-max(vWorld.y-uFogY,0.0)/uFogH);
  f=clamp(f+hf*0.18*smoothstep(0.0,uFogD*0.7,d),0.0,0.94);
  c=mix(c,uFog,f);
  /* 高光软压缩：雪坡、水面和云隙不再一过曝就糊成纯白。 */
  c=max(c,0.0);
  c=1.0-exp(-c*1.12);
  c=pow(c,vec3(0.86));
  /* 暗角：把四周压暗，视线聚到队伍要走的那条路上 */
  vec2 uv=gl_FragCoord.xy/uRes;
  float vg=1.0-0.10*pow(length((uv-0.5)*vec2(1.0,0.88))*1.6,2.2);
  outColor=vec4(c*vg,uAlpha);
}`;
const VS_SKY = `#version 300 es
layout(location=0) in vec2 aPos; out vec2 vUV;
void main(){ vUV=aPos; gl_Position=vec4(aPos,0.9999,1.0); }`;
const FS_SKY = `#version 300 es
precision mediump float;
in vec2 vUV; out vec4 outColor;
uniform vec3 uTop,uHor,uFog,uSunCol; uniform vec2 uSun; uniform float uAsp,uCloud,uTime;
void main(){
  float y=clamp(vUV.y*0.5+0.5,0.0,1.0);
  vec3 c=mix(uHor,uTop,pow(y,0.95));
  /* 翻滚浓云：多层低频叠加，低空更厚 —— 天空不再是干净的观光渐变 */
  vec2 q=vUV*vec2(uAsp,1.0);
  float cl=sin(q.x*3.1+uTime*0.07)*sin(q.y*4.3-uTime*0.05)
          +0.55*sin(q.x*6.7-q.y*5.1+uTime*0.09)
          +0.30*sin(q.x*12.3+q.y*9.4-uTime*0.13);
  cl=smoothstep(-0.35,0.75,cl);
  float low=1.0-smoothstep(0.05,0.78,y);
  float amt=uCloud*(0.30+0.46*low);
  c*=1.0-amt*cl*0.55;
  c+=vec3(0.045,0.045,0.05)*amt*(1.0-cl)*0.5;
  vec2 dv=(vUV-uSun)*vec2(uAsp,1.0);
  c+=uSunCol*exp(-pow(length(dv)*2.9,2.0))*0.38*(1.0-amt*0.5*cl);
  c=mix(uFog,c,smoothstep(0.0,0.55,y));
  outColor=vec4(c,1.0);
}`;
const VS_SNOW = `#version 300 es
layout(location=0) in vec3 aPos; uniform mat4 uVP; uniform float uTime; uniform vec3 uBase; uniform float uSpan,uWind;
out float vA;
void main(){
  vec3 p=aPos;
  p.y=mod(p.y-uTime*(3.0+uWind*0.35),uSpan);
  /* 寒风：雪不是垂直落下，是被风横着抽过去 */
  p.x=mod(p.x+uTime*uWind*2.2+sin(uTime*0.9+aPos.z)*1.6+90.0,180.0)-90.0;
  p.z+=sin(uTime*0.6+aPos.x)*0.9;
  gl_Position=uVP*vec4(p+uBase,1.0);
  gl_PointSize=(1.2+1.6*fract(aPos.y*0.137))*(1.0+uWind*0.12);
  vA=0.20+0.30*fract(aPos.x*0.271);
}`;
const FS_SNOW = `#version 300 es
precision mediump float; in float vA; uniform vec3 uPCol; uniform float uStreak; out vec4 outColor;
void main(){
  vec2 p=gl_PointCoord-0.5;
  /* 风越大，雪粒被抽成越斜越长的一道丝；没风时近似圆点 */
  float d=length(vec2(p.x-p.y*0.85*(0.25+uStreak), p.y*(1.0+uStreak*1.7)));
  float a=vA*smoothstep(0.52,0.10,d);
  outColor=vec4(uPCol,a);
}`;
/* 专属水体着色：法线扰动（流动感）+ 菲涅尔反射（折射感）+ 阳光高光。
   不再是一块死色蓝板：水面随视线角度反射天空、被太阳斜照出亮带、随流动泛起流光。 */
const VS_WATER = `#version 300 es
layout(location=0) in vec3 aPos; layout(location=2) in vec3 aColor;
uniform mat4 uVP; uniform float uTime,uFlow,uCalm;
out vec3 vWorld; out vec3 vCol; out float vRip;
void main(){
  vec3 p=aPos;
  /* 顶点波动：水面不是死平面，随流动轻微起伏（流向/折射观感来自此）。
     uCalm=1 是草地死水/沼泽：只留极轻的呼吸 —— 一整片水面被折成锡纸就是这里幅度太大。 */
  float amp=mix(1.0,0.15,uCalm);
  float w=sin(p.x*0.18+uTime*1.6*uFlow)*0.20+sin(p.z*0.22-uTime*1.3*uFlow)*0.15;
  w+=sin((p.x+p.z)*0.31+uTime*2.1*uFlow)*0.07;
  w*=amp;
  p.y+=w; vRip=w;
  vWorld=p; vCol=aColor;
  gl_Position=uVP*vec4(p,1.0);
}`;
const FS_WATER = `#version 300 es
precision highp float;
in vec3 vWorld; in vec3 vCol; in float vRip;
uniform vec3 uCam,uFog,uSky,uSunDir,uSunCol;
uniform float uFogD,uTime,uFlow,uAlpha,uCalm;
out vec4 outColor;
float hash21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float vnoise21(vec2 p){
  vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
  return mix(mix(hash21(i),hash21(i+vec2(1.0,0.0)),f.x),
             mix(hash21(i+vec2(0.0,1.0)),hash21(i+vec2(1.0,1.0)),f.x),f.y);
}
void main(){
  vec3 V=normalize(uCam-vWorld);
  /* 法线扰动：沿流向拉长的多层波纹（各向异性），水面才有"被风推着走"的流向感。
     沼泽里把扰动压小 —— 死水不该闪成碎镜子。 */
  float tilt=mix(1.0,0.34,uCalm);
  float a=vWorld.x*0.35+vWorld.z*0.10, b=vWorld.x*0.12-vWorld.z*0.40, c=(vWorld.x+vWorld.z)*0.9;
  float n1=sin(a+uTime*1.7*uFlow), n2=sin(b-uTime*2.4*uFlow), n3=sin(c+uTime*1.1*uFlow);
  float n4=sin((vWorld.x*0.7-vWorld.z*0.5)*2.0+uTime*3.3*uFlow);
  vec2 q=vWorld.xz;
  float dn1=vnoise21(q*0.55+vec2(uTime*0.08,-uTime*0.05))-0.5;
  float dn2=vnoise21(q*1.90-vec2(uTime*0.12,uTime*0.08))-0.5;
  vec3 N=normalize(vec3(-(n1*0.20+n3*0.30+n4*0.12+dn1*0.30+dn2*0.12)*tilt, 1.0,
                        -(n2*0.20-n3*0.30+n4*0.07+dn1*0.24-dn2*0.10)*tilt));
  vec3 base=vCol;
  /* 波峰泛白、波谷偏深，水才有体积与流向 */
  base=mix(base, base*1.22, clamp(vRip*0.5+0.5,0.0,1.0)*0.5);
  /* 菲涅尔：掠射角反射天空，正交俯看显水色（折射感） */
  float fres=pow(1.0-max(dot(N,V),0.0),3.0);
  vec3 refl=mix(uSky,uSunCol,0.25);
  /* 阳光高光：水面被太阳斜照出的亮带 */
  vec3 H=normalize(uSunDir+V);
  float spec=pow(max(dot(N,H),0.0),mix(58.0,112.0,uCalm))*mix(0.30,0.07,uCalm);
  /* 流动亮纹：像被风推着走的流光，强化"水在流" */
  float flow=0.5+0.5*sin((vWorld.x*0.5-vWorld.z*0.3)+uTime*3.0*uFlow);
  vec3 col=mix(base,refl,clamp(fres*mix(0.92,0.34,uCalm),0.0,0.78));
  col+=uSunCol*spec;
  col+=base*flow*mix(0.05,0.012,uCalm);
  col*=1.0+(vnoise21(q*0.85+vec2(uTime*0.03,uTime*0.02))-0.5)*0.07;
  float d=length(vWorld-uCam);
  float f=1.0-exp(-pow(d/uFogD,1.55));
  col=mix(col,uFog,clamp(f,0.0,0.95));
  col=max(col,0.0);
  col=1.0-exp(-col*1.12);
  col=pow(col,vec3(0.86));
  outColor=vec4(col,uAlpha);
}`;

function compile(gl, type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s) || 'shader 编译失败');
  return s;
}
function program(gl, vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl, gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl, gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p) || 'link 失败');
  return p;
}

/* ---------- 分块流式地形 ----------
   世界切成 CH×CH 的方块，只建相机周围。近处 32×32 格、中 16×16、远 8×8，
   超视距的块直接 deleteBuffer 释放——这就是「只显示当前节点周围」的落地方式。 */
let NXB = 1, NZB = 1;
/* 块面放大一档：台阶更整、更清楚，不再是一地细碎的小方块 */
/* 块尺寸必须整除 CH(76.8)：3.2/6.4/12.8 = 24/12/6，4.8/9.6/19.2 = 16/8/4。
   比上一版（2.4/4.4/8.0）整体放大约 1/3 —— 体素「像素」更大、更清楚（用户要的清晰度），
   且仍精确整除，块边界不会再漏缝。 */
const LOD_CELL_HI = [3.2, 6.4, 12.8], LOD_CELL_LO = [4.8, 9.6, 19.2];
const LOD_DIST_HI = [130, 310, 520], LOD_DIST_LO = [110, 240, 410];
let VIEW_FAR = 560;
let CHUNKS = new Map();      /* key → {lod,count,vao,vbo,cx,cz} */
let NODEM = [];              /* 节点建筑群，各自一份 VBO */
let FAR = { vao: null, vbo: null, count: 0 };   /* 俯瞰远景：整图一块粗粒度网格 */
let WATER = { vao: null, vbo: null, count: 0 };  /* 大江大河：沿河折线的水面带 */
let VEG = { vao: null, vbo: null, count: 0 };    /* 沿线地域植被（松/竹/茶/杨/枣…） */
let MARSH = { vao: null, vbo: null, count: 0 };  /* 若尔盖草地：望不到边的水泊（半透明泥水） */
let MARSH_TUFT = { vao: null, vbo: null, count: 0 };  /* 草地水泊边缘的不透明草墩 */
let skyVAO = null, skyVBO = null, snowVAO = null, snowVBO = null;
let GEOM_STATS = { chunks: 0, verts: 0 };

function setupAttribs(gl) {
  const st = 9 * 4;
  [['aPos', 3, 0], ['aNormal', 3, 12], ['aColor', 3, 24]].forEach(([name, size, off]) => {
    const loc = gl.getAttribLocation(S.pr.main, name);
    if (loc >= 0) { gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, size, gl.FLOAT, false, st, off); }
  });
}
function uploadMesh(data, count) {
  const gl = S.gl;
  const o = { count, vao: gl.createVertexArray(), vbo: gl.createBuffer() };
  gl.bindVertexArray(o.vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, o.vbo);
  gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
  setupAttribs(gl);
  gl.bindVertexArray(null);
  return o;
}
function killMesh(o) {
  if (!o) return;
  S.gl.deleteBuffer(o.vbo); S.gl.deleteVertexArray(o.vao);
}
function makeChunk(ix, iz, lod) {
  const cells = S.quality === 'low' ? LOD_CELL_LO : LOD_CELL_HI;
  vreset();
  buildVoxelChunk(ix, iz, cells[lod]);
  const m = uploadMesh(V.slice(0, VW), vCount);
  m.lod = lod;
  m.cx = (ix + .5) * CH - HALFX;
  m.cz = (iz + .5) * CH - HALFZ;
  return m;
}
function freeChunk(k) {
  const c = CHUNKS.get(k);
  if (c) { killMesh(c); CHUNKS.delete(k); }
}
/* 按距离决定 LOD，逐帧在时间预算内补齐；超视距块立刻回收 */
function updateChunks(px, pz, budgetMs) {
  const t0 = performance.now();
  const dists = S.quality === 'low' ? LOD_DIST_LO : LOD_DIST_HI;
  VIEW_FAR = dists[2];
  const cx = clamp(Math.floor((px + HALFX) / CH), 0, NXB - 1);
  const cz = clamp(Math.floor((pz + HALFZ) / CH), 0, NZB - 1);
  const R = Math.ceil(VIEW_FAR / CH);
  const need = [], live = new Set();
  for (let iz = Math.max(0, cz - R); iz <= Math.min(NZB - 1, cz + R); iz++) {
    for (let ix = Math.max(0, cx - R); ix <= Math.min(NXB - 1, cx + R); ix++) {
      const bx = (ix + .5) * CH - HALFX, bz = (iz + .5) * CH - HALFZ;
      const d = Math.hypot(bx - px, bz - pz);
      const lod = d < dists[0] ? 0 : d < dists[1] ? 1 : d < dists[2] ? 2 : -1;
      if (lod < 0) continue;
      const k = ix * 4096 + iz;
      live.add(k);
      const c = CHUNKS.get(k);
      if (!c) need.push({ ix, iz, lod, d, cur: -1 });
      else if (c.lod !== lod) need.push({ ix, iz, lod, d, cur: c.lod });
    }
  }
  for (const k of Array.from(CHUNKS.keys())) if (!live.has(k)) freeChunk(k);
  if (!need.length) return 0;
  need.sort((a, b) => (a.d - b.d) || (b.lod - a.lod));
  for (const q of need) {
    if (performance.now() - t0 > budgetMs) break;
    const k = q.ix * 4096 + q.iz;
    const nc = makeChunk(q.ix, q.iz, q.lod);   /* 先建新的再删旧的，换 LOD 时不闪白 */
    const old = CHUNKS.get(k);
    CHUNKS.set(k, nc);
    if (old) killMesh(old);
  }
  return need.length;
}

/* ---------- VoxelMap 接口 ---------- */
const S = {
  inited: false, quality: 'high', gl: null, canvas: null, raf: 0, paused: false, pauseRefs: 0,
  snowVao: null, snowVbo: null, pr: {}, u: {},
  uPos: 0, speed: 0, lookYaw: 0, lookPitch: -.35, viewMode: 'near', nearZoom: 1,
  free: false, freeFocus: null, freeYaw: 0, freePitch: 0.5, freeDist: 120, keys: {},
  tween: null, listeners: {}, lastNode: null, t0: 0, frames: 0, fps: 0,
  cleanups: [], weather: 'snow', fly: null, flyName: '长征全线', orbit: 0, intro: 0,
  eye: [0, 40, 0], at: [0, 0, 0], pend: 0, ready: false
};
function emit(evt, data) { (S.listeners[evt] || []).forEach(cb => { try { cb(data); } catch (e) { console.warn(e); } }); }
function urlAt(u) {
  const t = clamp(u, 0, 1) * (ROUTE.length - 1), i = Math.floor(t), f = t - i;
  const a = ROUTE[clamp(i, 0, ROUTE.length - 1)], b = ROUTE[clamp(i + 1, 0, ROUTE.length - 1)];
  return [lerp(a[0], b[0], f), lerp(a[1], b[1], f)];
}

/* 建世界：分块地形不预生成，只备好节点建筑、路线带、天空/雪花缓冲 */
function upload() {
  const gl = S.gl;
  NXB = Math.ceil(WORLD_X / CH); NZB = Math.ceil(WORLD_Y / CH);
  CHUNKS.forEach(c => killMesh(c)); CHUNKS.clear();
  NODEM.forEach(o => { if (o.smoke) killMesh(o.smoke); killMesh(o); }); NODEM = [];
  if (WATER.vao) { gl.deleteBuffer(WATER.vbo); gl.deleteVertexArray(WATER.vao); WATER = { vao: null, vbo: null, count: 0 }; }
  if (VEG.vao) { gl.deleteBuffer(VEG.vbo); gl.deleteVertexArray(VEG.vao); VEG = { vao: null, vbo: null, count: 0 }; }
  if (MARSH.vao) { gl.deleteBuffer(MARSH.vbo); gl.deleteVertexArray(MARSH.vao); MARSH = { vao: null, vbo: null, count: 0 }; }
  if (MARSH_TUFT.vao) { gl.deleteBuffer(MARSH_TUFT.vbo); gl.deleteVertexArray(MARSH_TUFT.vao); MARSH_TUFT = { vao: null, vbo: null, count: 0 }; }
  for (let i = 0; i < NODES3D.length; i++) {
    const d = buildNodeMesh(i);
    const m = uploadMesh(d.solid, d.solid.length / 9);
    m.x = NODES3D[i].x; m.z = NODES3D[i].z;
    if (d.smoke.length) m.smoke = uploadMesh(d.smoke, d.smoke.length / 9);
    NODEM.push(m);
  }
  RSEGS.forEach(sg => { if (sg.vbo) killMesh(sg); });
  buildRoute();
  RSEGS.forEach(sg => { const m = uploadMesh(sg.data, sg.count); sg.vao = m.vao; sg.vbo = m.vbo; });
  /* 俯瞰远景整图网格（粗粒度，单 draw call），只在俯瞰视角用 */
  if (FAR.vao) { gl.deleteBuffer(FAR.vbo); gl.deleteVertexArray(FAR.vao); }
  const fd = buildFarMesh(26);
  const fm = uploadMesh(fd.data, fd.count);
  FAR.vao = fm.vao; FAR.vbo = fm.vbo; FAR.count = fd.count;
  /* 大江大河水面 + 沿线植被：一次性建好，近景才画 */
  const wd = buildWater(); WATER = uploadMesh(wd.data, wd.count);
  const md = buildMarsh(); MARSH = uploadMesh(md.water.data, md.water.count);
  MARSH_TUFT = uploadMesh(md.tuft.data, md.tuft.count);
  const vd = buildVegetation(); VEG = uploadMesh(vd.data, vd.count);
  /* 全屏天空三角 */
  if (skyVBO) gl.deleteBuffer(skyVBO); if (skyVAO) gl.deleteVertexArray(skyVAO);
  skyVAO = gl.createVertexArray(); gl.bindVertexArray(skyVAO);
  skyVBO = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, skyVBO);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(gl.getAttribLocation(S.pr.sky, 'aPos'));
  gl.vertexAttribPointer(gl.getAttribLocation(S.pr.sky, 'aPos'), 2, gl.FLOAT, false, 0, 0);
  /* 雪花点集：只铺在相机附近一小块，靠 shader 跟着相机走 */
  const snow = [];
  for (let i = 0; i < 900; i++) snow.push((RNG() * 2 - 1) * 88, RNG() * 110, (RNG() * 2 - 1) * 88);
  if (snowVBO) gl.deleteBuffer(snowVBO); if (snowVAO) gl.deleteVertexArray(snowVAO);
  snowVAO = gl.createVertexArray(); gl.bindVertexArray(snowVAO);
  snowVBO = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, snowVBO);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(snow), gl.STATIC_DRAW);
  const sl = gl.getAttribLocation(S.pr.snow, 'aPos');
  gl.enableVertexAttribArray(sl); gl.vertexAttribPointer(sl, 3, gl.FLOAT, false, 0, 0);
  gl.bindVertexArray(null);
}

/* 相机：近景贴地行进、俯瞰绕行、自由漫游。三种模式都要保证机位不钻进山里（钻进去就只能看见一面墙） */
/* 自由漫游相机：拖拽转头/俯仰、滚轮缩放、WASD/方向键平移，给玩家适度自由探索余地。
   聚焦点在地表上方，机位绕焦点做球坐标，物理兜底不沉入地形或水面以下。 */
function freeInit() {
  if (S.freeFocus) return;
  const p = urlAt(S.uPos);
  const fx = clamp(p[0], -HALFX + 24, HALFX - 24), fz = clamp(p[1], -HALFZ + 24, HALFZ - 24);
  S.freeFocus = [fx, sampleH(fx, fz) + 6, fz];
  S.freeYaw = S.lookYaw || 0; S.freePitch = 0.62; S.freeDist = 120;
}
function freeCam() {
  freeInit();
  const f = S.freeFocus;
  const cy = Math.cos(S.freeYaw), sy = Math.sin(S.freeYaw);
  const cp = Math.cos(S.freePitch), sp = Math.sin(S.freePitch);
  const dir = [sy, 0, cy];
  const dist = S.freeDist;
  const eye = [f[0] - dir[0] * dist * cp, f[1] + dist * sp + 8, f[2] - dir[2] * dist * cp];
  const at = [f[0], f[1], f[2]];
  const gEye = sampleH(eye[0], eye[2]) + 4; if (eye[1] < gEye) eye[1] = gEye;
  return { eye, at, region: regionAt(invX(f[0]), invZ(f[2])) };
}
function cameraAt(p, ease) {
  if (S.free) return freeCam();
  if (S.viewMode === 'near') {
    const far = urlAt(clamp(S.uPos + .06, 0, 1));
    let dx = far[0] - p[0], dz = far[1] - p[1];
    if (Math.abs(dx) < .001 && Math.abs(dz) < .001) { dx = 0; dz = 1; }
    const ca = Math.cos(S.lookYaw), sa = Math.sin(S.lookYaw);
    const rx = dx * ca - dz * sa, rz = dx * sa + dz * ca, rl = Math.hypot(rx, rz) || 1;
    const tx = rx / rl, tz = rz / rl;
    /* 机位退回路线后方、抬高俯视——像跟着队伍看前方山谷。
       陡坡段（川西/岷陇）路旁常有几百单位高的山壁：若只沿前进方向取最高点，侧面那道墙会把画面糊死。
       于是在机位前方一个扇形里取样地形最高点（含左右两侧），把机位抬到它上方，再压低视线俯看谷地。 */
    /* 竖屏不能沿用横屏机位：窄画幅里 Vertical FOV 全被天空吃掉，地图挤在底部。
       这里把机位略抬高、视线多压一点，并把目标高度限制在前方地面附近；用户仍可
       拖拽抬头看山与天，因为只在向下看时才套用构图上限。 */
    const portrait = S.canvas.clientHeight > S.canvas.clientWidth * 1.12;
    /* 近景缩放：只改「退多远、抬多高、看多远」，不改 uPos。
       以前双指捏合会沿路线挪机位，玩家想拉近看一眼却走出了好几格。 */
    const zoom = clamp(S.nearZoom || 1, .55, 2.2);
    const back = (portrait ? 86 : 76) * zoom;
    const up = (portrait ? 74 : 52) * clamp(.70 + .30 * zoom, .70, 1.55);
    const fwd = (portrait ? 76 : 56) * zoom;
    const bx = clamp(p[0] - tx * back, -HALFX + 6, HALFX - 6);
    const bz = clamp(p[1] - tz * back, -HALFZ + 6, HALFZ - 6);
    const nrx = -tz, nrz = tx;                  /* 右向量：横向取样，专门治"旁边的墙" */
    let maxNear = sampleH(bx, bz);
    for (let d = 0; d <= 90 * zoom; d += 15) {
      for (let s = -54 * zoom; s <= 54 * zoom; s += 27) {
        maxNear = Math.max(maxNear, sampleH(bx + tx * d + nrx * s, bz + tz * d + nrz * s));
      }
    }
    const boost = 12 * (1 - ease);
    const eyeY = Math.max(sampleH(bx, bz) + up, maxNear + 9) + boost;
    const eye = [bx, eyeY, bz];
    const ax2 = clamp(p[0] + tx * fwd, -HALFX, HALFX), az2 = clamp(p[1] + tz * fwd, -HALFZ, HALFZ);
    const groundAt = sampleH(ax2, az2);
    /* 俯仰改成「视线仰角」：lookPitch>0 抬头看山与天，<0 低头看路。
       旧版 at 永远落在 eye 下方 46，只能往下看 —— 玩家反馈"只能左右转、不能上下看"。 */
    const elev = clamp(S.lookPitch - (portrait ? .19 : 0), -1.0, 1.0) * 0.62;
    let atY = eyeY + Math.tan(elev) * fwd;
    if (elev < 0) atY = Math.max(atY, groundAt + 3);
    atY = Math.min(atY, eyeY + 160);
    if (portrait && elev < 0) atY = Math.min(atY, groundAt + 18);
    const at = [ax2, atY, az2];
    /* 物理兜底：机位/视点永不穿入地形或沉到水面以下（贴地漂移无碰撞数据，用高度钳制保不穿山） */
    const gEye = sampleH(eye[0], eye[2]) + 3.2;
    if (eye[1] < gEye) eye[1] = gEye;
    const gAt = sampleH(at[0], at[2]) + 1.6;
    if (at[1] < gAt) at[1] = gAt;
    return { eye, at, region: regionAt(invX(ax2), invZ(az2)) };
  }
  S.orbit = (S.orbit || 0);   /* 自转在 frame 里按 dt 推进，与帧率无关 */
  const fly = S.fly;
  if (fly) {
    const R = fly.r * 1.02 + 30, Hgt = fly.r * 0.5 + 25 * (1 - ease);
    const ang = S.orbit + Math.PI * .22 + S.lookYaw * .4;
    const eye = [fly.x + Math.cos(ang) * R, Hgt, fly.z + Math.sin(ang) * R];
    return { eye, at: [fly.x, fly.r * 0.16, fly.z], region: regionAt(invX(fly.x), invZ(fly.z)) };
  }
  /* 斜俯视：略高于山头、退到能装下整条长卷，才看得见山形而非一张色板。 */
  const portraitO = S.canvas.clientHeight > S.canvas.clientWidth * 1.12;
  /* 竖屏时从南向北看，让长轴落在竖直方向；同时退远到整幅地图都进画。
     横屏仍沿旧机位旋转，保持原来的长卷斜俯视。 */
  const R = WORLD_Y * (portraitO ? 1.36 : .95);
  /* 俯瞰也要能上下：仰角随 lookPitch 变化（默认 0.52 与旧版等高），
     拉到底可压成近地平线的长卷横视，拉到顶可近乎垂直俯视。 */
  const elevO = clamp((portraitO ? .66 : .52) - (S.lookPitch + .35) * 0.70, 0.10, 1.34);
  const ang = (portraitO ? Math.PI * .5 : 0) +
    Math.sin(S.orbit * 0.5) * (portraitO ? .07 : .16) + S.lookYaw * 0.4;
  const eye = [Math.cos(ang) * R * Math.cos(elevO), R * Math.sin(elevO), Math.sin(ang) * R * Math.cos(elevO)];
  return { eye, at: [0, 40, 0], region: regionAt(invX(0), invZ(0)) };
}

/* ---------- 俯瞰路线覆盖层 ----------
   3D 红线在整图俯视时只有一两个像素，节点地名也被缩到看不见。这里把同一条
   ROUTE 投影到屏幕空间的 2D 画布上：深色路基 + 暖红主线 + 前进箭头 + 主要关口
   地名。只在俯瞰时显示，不参与指针拾取；DPR 单独缩放，390px 竖屏也保持锐利。 */
const GATE_SHORT = {
  g1:'于都河', g2:'湘江', g3:'遵义', g4:'一渡赤水', g4b:'二渡赤水', g4c:'四渡赤水',
  g5:'皎平渡', g6:'彝海', g7:'安顺场', g7b:'泸定桥', g8:'夹金山', g9:'班佑河',
  g10:'崔古仓', g11:'腊子口', g12:'吴起镇'
};
const GATE_PRIO = ['g1','g2','g3','g4c','g5','g7b','g8','g9','g11','g12'];
let routeShown = false;
let routeWorld = null;

function syncOverlaySize() {
  if (!routeOverlay) return;
  const w = Math.max(1, stage.clientWidth), h = Math.max(1, stage.clientHeight);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const bw = Math.max(1, Math.round(w * dpr)), bh = Math.max(1, Math.round(h * dpr));
  if (routeOverlay.width !== bw || routeOverlay.height !== bh) {
    routeOverlay.width = bw; routeOverlay.height = bh;
  }
  routeCssW = w; routeCssH = h; routeOverlay._dpr = dpr;
}

function roundRectPath(ctx, x, y, w, h, r) {
  const rr = Math.min(r, w * .5, h * .5);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.lineTo(x + w - rr, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
  ctx.lineTo(x + w, y + h - rr);
  ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
  ctx.lineTo(x + rr, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
  ctx.lineTo(x, y + rr);
  ctx.quadraticCurveTo(x, y, x + rr, y);
  ctx.closePath();
}

function drawRouteOverlay(over) {
  if (!routeOverlay || !routeCtx) return;
  if (!over) {
    if (routeShown) {
      routeOverlay.style.display = 'none';
      routeCtx.setTransform(1, 0, 0, 1, 0, 0);
      routeCtx.clearRect(0, 0, routeOverlay.width, routeOverlay.height);
      routeShown = false;
    }
    return;
  }
  syncOverlaySize();
  if (!routeShown) { routeOverlay.style.display = 'block'; routeShown = true; }

  const ctx = routeCtx, W = routeCssW, H = routeCssH, dpr = routeOverlay._dpr || 1;
  const narrow = W <= 760;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, routeOverlay.width, routeOverlay.height);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  /* 路线点：沿 ROUTE 等距抽样，投影到屏幕；相机背面或远出画布时断开笔画。 */
  if (!routeWorld || routeWorld.length !== ROUTE.length) {
    routeWorld = ROUTE.map(r => [r[0], r[1], surfaceY(r[0], r[1]) + .75]);
  }
  const step = S.quality === 'low' ? 8 : 4, pad = 90, segs = [];
  let cur = [];
  for (let i = 0; i < ROUTE.length; i += step) {
    const r = routeWorld[i];
    const p = VoxelMap.project(r[0], r[1], r[2]);
    if (!p || !p.visible || p.x < -pad || p.x > W + pad || p.y < -pad || p.y > H + pad) {
      if (cur.length > 1) segs.push(cur);
      cur = []; continue;
    }
    cur.push(p);
  }
  if (cur.length > 1) segs.push(cur);

  /* 三段叠加：暗色路肩把红线从土黄地表上托起来，中间浅色边和红线本身都很细。 */
  const scale = narrow ? .84 : 1;
  const strokes = [[8.2 * scale, 'rgba(20,15,11,.68)'],
    [5.2 * scale, 'rgba(235,214,171,.84)'], [2.7 * scale, 'rgba(184,50,31,.96)']];
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const [lw, col] of strokes) {
    ctx.strokeStyle = col; ctx.lineWidth = lw;
    for (const seg of segs) {
      ctx.beginPath(); ctx.moveTo(seg[0].x, seg[0].y);
      for (let i = 1; i < seg.length; i++) ctx.lineTo(seg[i].x, seg[i].y);
      ctx.stroke();
    }
  }
  ctx.restore();

  /* 前进箭头：按屏幕路程均匀布点，缩到全景也不会丢失方向。 */
  const gap = narrow ? 118 : 150, size = narrow ? 4.8 : 5.8;
  let acc = gap * .55;
  ctx.save();
  ctx.lineJoin = 'round';
  for (const seg of segs) for (let i = 1; i < seg.length; i++) {
    const a = seg[i - 1], b = seg[i];
    const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy);
    if (len < .01) continue;
    acc += len;
    if (acc < gap) continue;
    acc = 0;
    const ux = dx / len, uy = dy / len, px = -uy, py = ux;
    const x = b.x, y = b.y;
    ctx.beginPath();
    ctx.moveTo(x + ux * size, y + uy * size);
    ctx.lineTo(x - ux * size * .62 + px * size * .68, y - uy * size * .62 + py * size * .68);
    ctx.lineTo(x - ux * size * .62 - px * size * .68, y - uy * size * .62 - py * size * .68);
    ctx.closePath();
    ctx.fillStyle = 'rgba(247,226,185,.94)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(45,28,18,.72)'; ctx.lineWidth = 1.1; ctx.stroke();
  }
  ctx.restore();

  /* 地名：只标 gate（大事节点）。窄屏显示优先节点，其余经过碰撞检测自动让位。 */
  const topEl = document.getElementById('ui-top');
  const botEl = document.getElementById('ui-bottom');
  const topSafe = topEl ? Math.max(56, topEl.getBoundingClientRect().bottom + 5) : 66;
  const lowSafe = botEl ? Math.min(H - 44, botEl.getBoundingClientRect().top - 5) : H - 58;
  const fs = narrow ? 10.5 : 12;
  const lh = fs + 11, padX = narrow ? 6 : 7, used = [];
  let gates = NODES3D.filter(n => n.kind === 'gate');
  if (narrow) gates = gates.filter(n => GATE_PRIO.indexOf(n.id) >= 0);
  const current = gates.find(n => n.id === S.lastNode);
  if (current) gates = [current].concat(gates.filter(n => n !== current));

  for (const n of gates) {
    const p = VoxelMap.project(n.x, n.z, surfaceY(n.x, n.z) + 5.2);
    if (!p || !p.visible || p.x < 8 || p.x > W - 8 || p.y < 8 || p.y > H - 8) continue;
    const isCur = n.id === S.lastNode;
    ctx.beginPath();
    ctx.arc(p.x, p.y, isCur ? (narrow ? 4.4 : 5.2) : (narrow ? 3.3 : 4), 0, 6.2832);
    ctx.fillStyle = isCur ? 'rgba(226,178,82,.98)' : 'rgba(24,19,14,.88)';
    ctx.fill();
    ctx.strokeStyle = isCur ? '#ffe3a2' : 'rgba(231,213,176,.88)';
    ctx.lineWidth = 1.35; ctx.stroke();

    const name = GATE_SHORT[n.id] || n.name;
    ctx.font = '600 ' + fs + 'px "PingFang SC","Microsoft YaHei",sans-serif';
    const tw = ctx.measureText(name).width;
    let bx = p.x + (narrow ? 7 : 9);
    if (bx + tw + padX * 2 > W - 6) bx = p.x - tw - padX * 2 - (narrow ? 7 : 9);
    let by = p.y - lh - 7;
    if (by < topSafe) by = p.y + 9;
    if (by + lh > lowSafe) by = p.y - lh - 9;
    if (by < topSafe || by + lh > lowSafe || bx < 5 || bx + tw + padX * 2 > W - 5) continue;
    const box = [bx - 2, by - 2, tw + padX * 2 + 4, lh + 4];
    if (used.some(u => box[0] < u[0] + u[2] && box[0] + box[2] > u[0] &&
      box[1] < u[1] + u[3] && box[1] + box[3] > u[1])) continue;
    used.push(box);
    roundRectPath(ctx, bx, by, tw + padX * 2, lh, 4);
    ctx.fillStyle = isCur ? 'rgba(63,44,22,.93)' : 'rgba(20,17,13,.82)';
    ctx.fill();
    ctx.strokeStyle = isCur ? 'rgba(246,207,122,.82)' : 'rgba(196,164,103,.48)';
    ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = isCur ? '#ffe7ad' : '#f2e4c8';
    ctx.textBaseline = 'middle';
    ctx.fillText(name, bx + padX, by + lh * .5 + .5);
  }
}

function frame(now) {
  if (!S.inited || S.paused) return;
  const gl = S.gl, dt = Math.min(.05, (now - (S.last || now)) / 1000); S.last = now;
  S.orbit = (S.orbit || 0) + dt * 0.6;            /* 俯瞰缓慢自转，按 dt 推进，与帧率无关 */
  if (S.free) {
    /* ★ 必须先确保聚焦点存在：旧版这一行不在，frame 直接读 null[0] 抛 TypeError，
       requestAnimationFrame 链就此断掉 —— 画面永久冻结，只能退出 3D 再来。
       这就是"漫游一开就卡死"的真正原因。 */
    freeInit();
    /* 自由漫游：WASD/方向键平移聚焦点（沿注视方向 fwd 与屏幕右向 right），滚轮在 bindEvents 里缩放。
       right 已修正为屏幕右向 = dir × up = [-cy,0,sy]，故 A 向左 / D 向右 不再反。
       Q/E 升降：独立改 focus.y——freeCam 用 f[1] 算 eye/at，整组机位随之升降，无需改 freeCam 公式。 */
    const cy = Math.cos(S.freeYaw), sy = Math.sin(S.freeYaw);
    const fwd = [sy, 0, cy], right = [-cy, 0, sy];
    const mv = dt * S.freeDist * 0.55;
    const vh = dt * S.freeDist * 0.40;          /* 垂直速度 */
    const K = S.keys || {};
    if (K['w'] || K['arrowup']) { S.freeFocus[0] += fwd[0] * mv; S.freeFocus[2] += fwd[2] * mv; }
    if (K['s'] || K['arrowdown']) { S.freeFocus[0] -= fwd[0] * mv; S.freeFocus[2] -= fwd[2] * mv; }
    if (K['a'] || K['arrowleft']) { S.freeFocus[0] -= right[0] * mv; S.freeFocus[2] -= right[2] * mv; }
    if (K['d'] || K['arrowright']) { S.freeFocus[0] += right[0] * mv; S.freeFocus[2] += right[2] * mv; }
    if (K['e']) S.freeFocus[1] += vh;           /* E 上升 */
    if (K['q']) S.freeFocus[1] -= vh;           /* Q 下降 */
    S.freeFocus[0] = clamp(S.freeFocus[0], -HALFX + 24, HALFX - 24);
    S.freeFocus[2] = clamp(S.freeFocus[2], -HALFZ + 24, HALFZ - 24);
    /* focus.y 双面钳制：地面以上 6（不钻山体）→ 地面以上 400（不至于飞太离谱，仍足以越过任何近旁高峰） */
    const gf = sampleH(S.freeFocus[0], S.freeFocus[2]);
    S.freeFocus[1] = clamp(S.freeFocus[1], gf + 6, gf + 400);
  } else if (S.tween) {
    const k = clamp((now - S.tween.t0) / 1200, 0, 1);
    S.uPos = lerp(S.tween.from, S.tween.to, smooth(k));
    if (k >= 1) S.tween = null;
  } else { S.uPos += dt * S.speed; if (S.uPos > 1) S.uPos = 0; }

  const p = urlAt(S.uPos);
  let best = null, bd = 6.5;
  NODES3D.forEach(n => { const d = Math.hypot(n.x - p[0], n.z - p[1]); if (d < bd) { bd = d; best = n; } });
  if (best && best.id !== S.lastNode) {
    S.lastNode = best.id; emit('nodePick', { id: best.id, name: best.name });
    if (placeEl) placeEl.textContent = '经过 · ' + best.name;
  }

  S.intro = Math.min(7, (S.intro || 0) + dt);
  const ease = smooth(clamp(S.intro / 4.5, 0, 1));
  const cam = cameraAt(p, ease);
  /* 相机阻尼：每帧朝目标缓动，消去 maxNear 取大/路线起伏造成的"过山车"抖动；
     时间常数 0.20s 与帧率无关，高刷/弱机都平稳。阻尼后再做地形兜底。 */
  const k = 1 - Math.exp(-dt / 0.20);
  if (!S.eyeD) S.eyeD = cam.eye.slice();
  if (!S.atD) S.atD = cam.at.slice();
  for (let i = 0; i < 3; i++) { S.eyeD[i] += (cam.eye[i] - S.eyeD[i]) * k; S.atD[i] += (cam.at[i] - S.atD[i]) * k; }
  const ge = sampleH(S.eyeD[0], S.eyeD[2]) + 3.2; if (S.eyeD[1] < ge) S.eyeD[1] = ge;
  const ga = sampleH(S.atD[0], S.atD[2]) + 1.6; if (S.atD[1] < ga) S.atD[1] = ga;
  S.eye = S.eyeD; S.at = S.atD;
  const over = S.viewMode === 'overview';
  /* 天候跟着脚下的地理位置连续走：往前一步天色变一点，不是七段硬切 */
  const wtT = over ? 0.55 : tAt(invZ(p[1]));
  const wt = weatherAt(wtT);
  S.weather = wt;
  /* 真实太阳方向（与天空光晕同一角度），用于主光照与水面高光，光影物理一致 */
  const sunDirVec = sunDir(wt.sunPos);

  /* 分块：只维护相机周围，每帧 14ms 预算，前进时慢慢补 —— 「雾里逐步浮现」就是这么来的。
     俯瞰时整图已由 FAR 一支网格兜底，不必再为全景铺几千细块。 */
  if (!over) S.pend = updateChunks(S.eye[0], S.eye[2], 14);

  const asp = S.canvas.width / Math.max(1, S.canvas.height);
  const farClip = over ? 4400 : VIEW_FAR + 700;
  const VP = mul(perspective(1.02, asp, 1.2, farClip), lookAt(S.eye, S.at, [0, 1, 0]));
  S.VP = VP;   /* 供 game3d.js 的 Game3D._tick 投影 3D 节点到屏幕（与 uVP 完全一致） */
  /* 远景带一点青蓝空气透视（中式山水味道），同时比旧版更亮更通透 */
  const fog = over ? mix(wt.fog, [.74, .78, .82], .40) : mix(wt.fog, [.62, .70, .80], .16);
  const fogD = over ? 4200 : wt.fogD * (S.quality === 'low' ? .88 : 1.10);
  const fogY = over ? -1e6 : 6;   /* 俯瞰关掉谷底云海，免得全景被压成灰雾 */

  gl.viewport(0, 0, S.canvas.width, S.canvas.height);
  gl.clearColor(fog[0], fog[1], fog[2], 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  /* 天空 */
  gl.disable(gl.DEPTH_TEST);
  gl.useProgram(S.pr.sky);
  gl.uniform3fv(S.u.skyTop, wt.top);
  gl.uniform3fv(S.u.skyHor, wt.hor);
  gl.uniform3fv(S.u.skyFog, fog);
  gl.uniform3fv(S.u.skySun, wt.sun);
  gl.uniform2fv(S.u.sunPos, over ? [-.40, .40] : wt.sunPos);
  gl.uniform1f(S.u.asp, asp);
  gl.uniform1f(S.u.skyCloud, over ? wt.cloud * .55 : wt.cloud);
  gl.uniform1f(S.u.skyTime, now / 1000);
  gl.bindVertexArray(skyVAO); gl.drawArrays(gl.TRIANGLES, 0, 3);

  /* 地形块 + 路线 + 建筑 */
  gl.enable(gl.DEPTH_TEST);
  gl.useProgram(S.pr.main);
  gl.uniformMatrix4fv(S.u.vp, false, VP);
  gl.uniform3fv(S.u.cam, S.eye);
  gl.uniform3fv(S.u.fog, fog);
  gl.uniform3fv(S.u.light, sunDirVec);
  gl.uniform3fv(S.u.sunCol, wt.sun);
  gl.uniform3fv(S.u.skyCol, wt.sky);
  gl.uniform1f(S.u.fogD, fogD);
  gl.uniform1f(S.u.fogY, fogY);
  gl.uniform1f(S.u.fogH, 16);
  gl.uniform1f(S.u.cloud, over ? wt.cloud * .5 : wt.cloud);
  gl.uniform1f(S.u.sat, Math.min(1.12, wt.sat * 1.15));
  gl.uniform1f(S.u.exp, wt.exp * 1.12);
  gl.uniform1f(S.u.gtime, now / 1000);
  gl.uniform2f(S.u.res, S.canvas.width, S.canvas.height);
  gl.uniform1f(S.u.alpha, 1.0);
  const eyex = S.eye[0], eyez = S.eye[2];
  const dirx = S.at[0] - eyex, dirz = S.at[2] - eyez;
  let verts = 0;
  if (over && FAR.vao) {                       /* 俯瞰：整图一块远景网格 */
    gl.bindVertexArray(FAR.vao); gl.drawArrays(gl.TRIANGLES, 0, FAR.count); verts += FAR.count;
  } else {
    for (const c of CHUNKS.values()) {
      /* 视锥粗剔除：相机背后 40 度以外的块不画 */
      const vx = c.cx - eyex, vz = c.cz - eyez;
      if (vx * dirx + vz * dirz < -CH * 2.4 && Math.hypot(vx, vz) > CH) continue;
      gl.bindVertexArray(c.vao);
      gl.drawArrays(gl.TRIANGLES, 0, c.count);
      verts += c.count;
    }
  }

    routeShown = false;
    S.listeners = {}; S.tween = null; S.intro = 0; S.lookYaw = 0; S.nearZoom = 1; S.fly = null; S.flyName = '长征全线';
    cover.style.display = 'flex'; hud.classList.remove('on'); hud.classList.remove('open');
    legendEl.classList.remove('on'); meta.classList.remove('on');
    const scrimEl = document.getElementById('menu-scrim'); if (scrimEl) scrimEl.classList.remove('on');
    const barEl = document.getElementById('g3d-topbar'); if (barEl) barEl.classList.remove('open');
    placeEl.textContent = ''; errBox.style.display = 'none';
  },
  get state() {
    let v = 0; CHUNKS.forEach(c => { v += c.count; });
    return { inited: S.inited, quality: S.quality, paused: S.paused,
      uPos: S.uPos, speed: S.speed, tween: !!S.tween,
      free: S.free, freeDist: Math.round(S.freeDist), nearZoom: +(S.nearZoom || 1).toFixed(2),
      lookYaw: +S.lookYaw.toFixed(3), lookPitch: +S.lookPitch.toFixed(3),
      focus: S.freeFocus ? S.freeFocus.map(v => Math.round(v)) : null,
      keys: Object.keys(S.keys || {}).filter(k => S.keys[k]),
      chunks: CHUNKS.size, grid: NXB + 'x' + NZB, vertices: v,
      fps: S.fps, weather: S.weather, viewMode: S.viewMode, pending: S.pend };
  }
};
window.VoxelMap = VoxelMap;

/* 统一启动口：先建 WebGL 场景，再把 3D 玩法引擎挂上去。
   放在页面末尾的脚本里调用，确保 data.js / game3d.js 已经加载。 */
window.CWQS_START_3D = function (quality) {
  if (VoxelMap.state && VoxelMap.state.inited) return true;
  const q = quality || (innerWidth <= 760 ? 'low' : 'high');
  if (!VoxelMap.init({ mount: stage, quality: q })) return false;
  const bq = document.getElementById('btn-quality'); if (bq) bq.textContent = '画质：' + q;
  if (window.Game3D) {
    Game3D.setNodes(NODES3D.map(n => ({ id:n.id, name:n.name, x:n.x, z:n.z, h:sampleH(n.x, n.z) })));
    Game3D.init(VoxelMap);
    /* 带 ?u= / ?node= 进来时，URL 就是这次要看的机位：别再被存档里的当前节点拽回去。 */
    if (Game3D.flyCurrent && !S.urlPin) Game3D.flyCurrent();
  }
  try { localStorage.setItem('cwqs_mode_v1', '3d'); } catch (e) {}
  return true;
};

/* 跳到某分段：相机飞到该 region 中心，缩近到其范围 */
function flyTo(key) {
  const r = REGION_META.find(x => x.key === key);
  if (!r) { S.fly = null; S.flyName = '长征全线'; return; }
  S.fly = { x: r.wx, z: r.wz, r: r.rWorld }; S.flyName = r.name;
  if (placeEl) placeEl.textContent = r.name;
}

/* ---------- 极简 UI ---------- */
const selRegion = $('#sel-region');
if (selRegion) {
  const all = document.createElement('option'); all.value = ''; all.textContent = '全景 · 长征全线'; selRegion.appendChild(all);
  REGION_ORDER.forEach(k => {
    const r = REGION_META.find(x => x.key === k); if (!r) return;
    const o = document.createElement('option'); o.value = k; o.textContent = r.name; selRegion.appendChild(o);
  });
  selRegion.addEventListener('change', e => flyTo(e.target.value));
}
/* 图例 */
(function buildLegend() {
  const order2 = REGION_ORDER;
  for (const k of order2) {
    const b = BIOME[k]; const r = REGION_META.find(x => x.key === k); if (!r) continue;
    const row = document.createElement('div'); row.className = 'row';
    const sw = document.createElement('span'); sw.className = 'sw';
    const rgb = c => 'rgb(' + Math.round(c[0]*255) + ',' + Math.round(c[1]*255) + ',' + Math.round(c[2]*255) + ')';
    sw.style.background = 'linear-gradient(90deg,' + rgb(b.lo) + ',' + rgb(b.hi) + ')';
    const tx = document.createElement('span'); tx.textContent = b.name;
    row.appendChild(sw); row.appendChild(tx); legendEl.appendChild(row);
  }
})();
$('#enter').addEventListener('click', () => window.CWQS_START_3D());

function save3dNow() {
  try { if (window.Game3D_Engine && Game3D_Engine.Store) Game3D_Engine.Store.save(); } catch (e) {}
}
function go2D() {
  save3dNow();
  var at = null;
  try {
    if (window.Game3D_Engine && Game3D_Engine.Store && Game3D_Engine.Store.s) at = Game3D_Engine.Store.s.at;
    if (!at) {
      var raw = localStorage.getItem('cwqs_save_v1');
      at = raw ? (JSON.parse(raw) || {}).at : null;
    }
  } catch (e) {}
  try { localStorage.setItem('cwqs_mode_v1', '2d'); } catch (e) {}
  location.href = 'index.html?v=38&from=3d' + (at ? '&node=' + encodeURIComponent(at) : '');
}
var switch2d = document.getElementById('switch-to-2d');
var cover2d = document.getElementById('cover-to-2d');
if (switch2d) switch2d.addEventListener('click', go2D);
if (cover2d) cover2d.addEventListener('click', go2D);

var toolsBtn = document.getElementById('btn-tools');
if (toolsBtn) toolsBtn.addEventListener('click', () => {
  var box = document.getElementById('hud3d');
  if (!box) return;
  var open = box.classList.toggle('open');
  toolsBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
});
$('#btn-view').addEventListener('click', e => {
  S.viewMode = S.viewMode === 'near' ? 'overview' : 'near';
  e.currentTarget.textContent = '视角：' + (S.viewMode === 'near' ? '近景' : '俯瞰');
  S.intro = 0;
  if (S.viewMode === 'near') drawRouteOverlay(false);
});
$('#btn-free').addEventListener('click', e => {
  S.free = !S.free;
  if (S.free) { S.freeFocus = null; e.currentTarget.textContent = '漫游：开'; err(TOUCH_3D ? '自由漫游：左下前后左右移动，右下上升/下降；双指捏合缩放，单指拖动看四周；中心「回正」回到部队' : '自由漫游：拖拽转头/俯仰，滚轮缩放；WASD / 方向键 平移，Q 下降 / E 上升'); }
  else { e.currentTarget.textContent = '漫游：关'; S.lookYaw = 0; S.lookPitch = -.35; }
});
$('#btn-legend').addEventListener('click', () => legendEl.classList.toggle('on'));
$('#btn-quality').addEventListener('click', e => {
  const next = S.quality === 'high' ? 'low' : 'high';
  VoxelMap.dispose(); VoxelMap.init({ mount: stage, quality: next });
  e.target.textContent = '画质：' + next;
});
$('#btn-pause').addEventListener('click', e => {
  if (S.paused) { VoxelMap.resume(); e.target.textContent = '暂停'; } else { VoxelMap.pause(); e.target.textContent = '继续'; }
});
$('#btn-shot').addEventListener('click', () => {
  const url = VoxelMap.capture(); if (!url) return;
  const a = document.createElement('a'); a.href = url; a.download = '万水千山-全线.png'; a.click();
});
$('#btn-exit').addEventListener('click', () => VoxelMap.dispose());

/* ---------- 手机端菜单抽屉 ----------
   主界面只留「菜单」一个入口；木牌/名单墙/史料/行囊/战友/手册/记忆/存档/清空
   全部收进底部抽屉。桌面这些按钮仍在原来的顶栏，不受影响。 */
(function bindMobileMenu() {
  const btn = document.getElementById('nav-menu');
  const bar = document.getElementById('g3d-topbar');
  const box = document.getElementById('hud3d');
  const scrim = document.getElementById('menu-scrim');
  if (!btn || !bar) return;
  const close = () => {
    bar.classList.remove('open');
    if (box) box.classList.remove('open');
    if (scrim) scrim.classList.remove('on');
    btn.setAttribute('aria-expanded', 'false');
  };
  const openMenu = () => {
    close();
    bar.classList.add('open');
    if (scrim) scrim.classList.add('on');
    btn.setAttribute('aria-expanded', 'true');
  };
  btn.addEventListener('click', () => {
    if (bar.classList.contains('open')) close(); else openMenu();
  });
  if (scrim) scrim.addEventListener('click', close);
  bar.addEventListener('click', e => {
    const item = e.target.closest('button, a'); if (!item) return;
    if (item.id === 'nav-view') return;   /* 视角面板由下面单独接管 */
    setTimeout(close, 0);
  });
  const viewBtn = document.getElementById('nav-view');
  if (viewBtn) viewBtn.addEventListener('click', () => {
    close();
    if (box) box.classList.add('open');
    if (scrim) scrim.classList.add('on');
  });
  const twoDBtn = document.getElementById('nav-2d');
  if (twoDBtn) twoDBtn.addEventListener('click', go2D);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
})();
const camResetBtn = document.getElementById('cam-reset');
if (camResetBtn) camResetBtn.addEventListener('click', resetView);

/* ---------- 触屏移动盘：按住即动，松手即停 ----------
   左下前后左右、右下上升/下降，复用键盘那套 S.keys，帧循环统一结算。
   第一次按方向键时自动打开漫游；中心「回正」退出漫游、回到部队。
   缩放不设按钮：双指捏合已经在 canvas 上处理，避免第三个缩放入口。 */
(function bindTouchPad() {
  const pad = document.getElementById('touch-pad');
  if (!pad) return;
  const KEYS = ['w', 'a', 's', 'd', 'e', 'q'];
  const setKey = (k, on) => { (S.keys = S.keys || {})[k] = on; };
  const letGo = () => { KEYS.forEach(k => setKey(k, false)); pad.querySelectorAll('.press').forEach(b => b.classList.remove('press')); };
  pad.querySelectorAll('button[data-k]').forEach(btn => {
    const k = btn.getAttribute('data-k');
    const stop = () => {
      setKey(k, false);
      btn.classList.remove('press');
    };
    btn.addEventListener('pointerdown', e => {
      e.preventDefault();
      btn.classList.add('press');
      try { btn.setPointerCapture(e.pointerId); } catch (ignore) {}
      /* 跟随态按方向键＝玩家想自己走：先开漫游，再按住移动。 */
      if (!S.free) { const bf = document.getElementById('btn-free'); if (bf) bf.click(); }
      setKey(k, true);
    });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => btn.addEventListener(ev, stop));
  });
  /* 松手不一定落在按钮上（手指滑出、切后台、来电话），这几个兜底必须留 —— 漏一次相机就一直往前飞 */
  window.addEventListener('blur', letGo);
  document.addEventListener('visibilitychange', () => { if (document.hidden) letGo(); });
})();
VoxelMap.on('nodePick', d => { if (VoxelMap.state.viewMode === 'near') placeEl.textContent = '经过 · ' + d.name; });

/* URL 参数：?auto=1 自动进 3D；?region=KEY 飞到分段；?view=near 进近景；?u=0.5 定位到路线中途 */
if (typeof location !== 'undefined') {
  const Q = location.search;
  const mReg = /[?&]region=([a-z]+)/.exec(Q);
  if (mReg && REGION_META.find(x => x.key === mReg[1])) { const r = REGION_META.find(x => x.key === mReg[1]); S.fly = { x: r.wx, z: r.wz, r: r.rWorld }; S.flyName = r.name; }
  if (/[?&]view=near/.test(Q)) { S.viewMode = 'near'; }
  if (/[?&]view=overview/.test(Q)) { S.viewMode = 'overview'; }
  if (/[?&]still=1/.test(Q)) { S.speed = 0; S.intro = 7; }
  const mU = /[?&]u=([0-9.]+)/.exec(Q);
  if (mU) { S.uPos = clamp(parseFloat(mU[1]) || 0, 0, 1); S.tween = null; S.urlPin = true; }
  /* ?cam=fx,fz[,dist,pitch,yaw]：指定自由机位。玩家用不到，是给「自查/截图取证」用的，
     让水面、地形、聚落这类只能"看"的东西每次都能在同一机位复现。 */
  const mCam = /[?&]cam=(-?[\d.]+),(-?[\d.]+)(?:,([\d.]+))?(?:,([\d.]+))?(?:,(-?[\d.]+))?/.exec(Q);
  if (mCam) {
    S.free = true;
    S.urlPin = true;                 /* 显式机位优先，启动时不要被当前节点拽回跟随视角 */
    const fx = clamp(parseFloat(mCam[1]), -HALFX + 24, HALFX - 24);
    const fz = clamp(parseFloat(mCam[2]), -HALFZ + 24, HALFZ - 24);
    S.freeFocus = [fx, sampleH(fx, fz) + 6, fz];
    if (mCam[3]) S.freeDist = clamp(parseFloat(mCam[3]), 30, 600);
    if (mCam[4]) S.freePitch = clamp(parseFloat(mCam[4]), 0.05, 1.30);
    if (mCam[5] !== undefined) S.freeYaw = parseFloat(mCam[5]);
  }
  const mNode = /[?&]node=([A-Za-z0-9_]+)/.exec(Q);
  if (mNode) { const nn = NODES3D.find(x => x.id === mNode[1]); if (nn) { let bu = 0, bd = 1e9; ROUTE.forEach((r, k) => { const d = Math.hypot(r[0] - nn.x, r[1] - nn.z); if (d < bd) { bd = d; bu = k / (ROUTE.length - 1); } }); S.uPos = bu; S.tween = null; S.urlPin = true; } }
  /* 自动进入放在 game3d.js 加载之后，见页面末尾的启动脚本 */
}
})();
</script>
<script src="data.js?v=38"></script>
<script src="game3d.js?v=38"></script>
<script>
(function () {
  var Q = location.search;
  if (!/[?&](play|auto)=1/.test(Q)) return;
  function start() {
    if (!window.CWQS_START_3D) return;
    window.CWQS_START_3D();
    if (/[?&]from=(2d|start)/.test(Q)) {
      setTimeout(function () {
        try { if (window.Game3D_Engine) Game3D_Engine.Toast.show('已同步进度 · 立体长卷'); } catch (e) {}
      }, 700);
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>
