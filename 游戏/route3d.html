<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="长征：万水千山 —— 立体长卷，与平面行军共用同一局进度。">
<title>长征：万水千山 · 立体长卷</title>
<style>
  :root { --red:#8C3B2E; --warm:#B8AC93; --cool:#4A5A63; --paper:#E6DCC4; --ink:#17150f;
    --paper-2:#e6dcc4; --line:#b3a68a; --river:#4a6f7c; --grass:#4d7a52; --gold:#a5813a; --warn:#7c2f22;
    --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;
    --sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
  * { box-sizing:border-box; }
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#17150f; color:var(--paper);
    font-family:"Songti SC","SimSun",serif; }
  #stage { position:absolute; inset:0; }
  #stage canvas { display:block; width:100%; height:100%; touch-action:none; cursor:grab; }
  #route-overlay { position:absolute; inset:0; z-index:3; width:100%; height:100%; pointer-events:none; display:none; }
  #cover { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center;
    align-items:center; text-align:center; padding:24px;
    background:radial-gradient(720px 520px at 63% 38%,rgba(181,154,104,.14),transparent 68%),
      linear-gradient(180deg,#171d23 0%,#272a27 48%,#14130f 100%); }
  .peaks { position:absolute; inset:0; pointer-events:none; opacity:.62; }
  .peaks i { position:absolute; bottom:0; display:block; background:var(--cool); }
  .peaks i:nth-child(1){ left:-6%; width:62%; height:46%; clip-path:polygon(0 100%,36% 12%,70% 74%,100% 100%); background:#3d4a52; }
  .peaks i:nth-child(2){ left:38%; width:70%; height:58%; clip-path:polygon(0 100%,42% 0%,72% 62%,100% 100%); background:#4a565d; }
  .peaks i:nth-child(3){ left:60%; width:56%; height:38%; clip-path:polygon(0 100%,52% 18%,100% 100%); background:#57636a; }
  .snowcap { position:absolute; inset:0; pointer-events:none; opacity:.5;
    background:radial-gradient(ellipse 30% 9% at 59% 42%, #e6dcc4 0%, transparent 70%); }
  #cover .inner { position:relative; z-index:2; width:min(680px,100%); padding:34px clamp(22px,5vw,52px) 30px;
    border:1px solid rgba(199,184,152,.24); border-radius:6px;
    background:linear-gradient(180deg,rgba(20,20,17,.48),rgba(16,16,13,.7));
    box-shadow:0 28px 80px rgba(0,0,0,.32),inset 0 0 0 1px rgba(255,255,255,.025);
    backdrop-filter:blur(8px); }
  .cover-kicker { margin:0 0 12px; font-family:var(--sans); font-size:10px; letter-spacing:3px; color:#bca97f; }
  h1 { margin:0 0 10px; font-size:clamp(36px,5vw,52px); font-weight:500; letter-spacing:.34em; text-indent:.34em; }
  .sub { font-size:13px; letter-spacing:.24em; color:#b9ae96; margin-bottom:34px; }
  .btn { font-family:inherit; font-size:14px; letter-spacing:.2em; color:var(--paper); cursor:pointer;
    padding:11px 28px; border:1px solid rgba(182,172,147,.5); background:rgba(140,59,46,.26); border-radius:2px; }
  .btn:hover { background:rgba(140,59,46,.6); }
  .btn.primary { background:rgba(140,59,46,.86); border-color:#b76b57; color:#fff1da; box-shadow:0 8px 24px rgba(80,25,18,.26); }
  .btn.primary:hover { background:#a34a39; }
  .btn.ghost { background:rgba(255,255,255,.035); }
  .cover-actions { display:flex; justify-content:center; flex-wrap:wrap; gap:10px; }
  .cover-home { align-self:center; font-family:var(--sans); font-size:11px; letter-spacing:1px; color:#a99f89;
    text-decoration:none; border-bottom:1px solid rgba(169,159,137,.35); padding-bottom:2px; }
  .cover-home:hover { color:#eee1c7; }
  .note { margin:24px auto 0; font-size:11px; line-height:1.95; color:#8f8776; max-width:540px; }
  .note b { color:#c9b995; font-weight:500; }
  /* 顶/底两条流式带：左·中·右三区用 auto margin 排布，装不下整块换行。
     以前每个控件各自 absolute 钉一个 top/bottom 像素值，窗口一窄就全压在一起。 */
  #ui-top, #ui-bottom { position:absolute; left:16px; right:16px; z-index:6; display:flex;
    flex-wrap:wrap; gap:10px; pointer-events:none; }
  /* 顶带里的手机菜单抽屉必须盖住底栏；弹窗 root 仍在其上（z-index 30）。 */
  #ui-top { z-index:20; }
  #ui-top { top:16px; align-items:flex-start; }
  #ui-bottom { bottom:16px; align-items:flex-end; }
  #ui-top-l, #ui-bottom-l, #ui-bottom-r { display:flex; flex-direction:column; gap:8px; }
  #ui-top-l, #ui-bottom-l { align-items:flex-start; }
  #ui-bottom-r { align-items:flex-end; }
  #g3d-nav-slot:empty, #toast:empty { display:none; }
  #hud3d, #legend, #g3d-topbar, #hud, #next-pill, #hand-tray, #comrade-tray, #meta, #err, #g3d-nav {
    pointer-events:auto; }

  /* ===== 与平面版共用的模式切换 / 顶栏 ===== */
  .g3d-brandbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:6px 8px; border:1px solid rgba(182,172,147,.22); border-radius:6px;
    background:linear-gradient(180deg,rgba(20,19,15,.78),rgba(16,15,12,.66));
    box-shadow:0 10px 30px rgba(0,0,0,.16); backdrop-filter:blur(7px); }
  .g3d-brand { display:flex; align-items:center; gap:9px; }
  .g3d-seal { display:inline-block; padding:3px 6px; color:#f6ecd9; background:#8C3B2E;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.23); font-size:11px; letter-spacing:2px; }
  .g3d-title { font-size:17px; letter-spacing:4px; color:#f0e6d2; white-space:nowrap; }
  .g3d-sub { font-family:var(--sans); font-size:10px; letter-spacing:1px; color:#968b77; }
  .mode-switch { display:flex; align-items:center; gap:2px; padding:2px;
    border:1px solid rgba(151,137,111,.34); border-radius:999px; background:rgba(5,5,4,.25); }
  .mode-tab { display:inline-flex; align-items:center; gap:5px; min-height:28px; padding:4px 9px;
    border:0; border-radius:999px; background:transparent; color:#a99d87; text-decoration:none;
    font-family:var(--sans); font-size:10.5px; letter-spacing:.7px; cursor:pointer; }
  .mode-tab i { width:4px; height:4px; border-radius:50%; background:currentColor; opacity:.65; }
  .mode-tab.active { color:#241812; background:linear-gradient(#f3e8d2,#d8c8aa);
    box-shadow:0 2px 8px rgba(0,0,0,.26),inset 0 0 0 1px rgba(255,255,255,.38); }
  .mode-tab.active i { background:#8C3B2E; opacity:1; }
  button.mode-tab:hover { color:#f2e7d2; background:rgba(255,255,255,.07); }
  .mode-sync { display:inline-flex; align-items:center; gap:5px; margin:0 3px 0 5px; padding-left:8px;
    border-left:1px solid rgba(154,140,112,.24); font-family:var(--sans); font-size:9px;
    letter-spacing:.6px; color:#83a18c; white-space:nowrap; }
  .mode-sync i { width:4px; height:4px; border-radius:50%; background:#79a987; }
  .g3d-hub { font-family:var(--sans); font-size:10px; letter-spacing:1px; color:#cdb185;
    text-decoration:none; border:1px solid rgba(197,161,92,.24); border-radius:3px; padding:5px 8px; }
  .g3d-hub:hover { color:#fff1d5; background:rgba(197,161,92,.1); }

  #hud3d { display:none; flex-direction:column; gap:6px; align-items:flex-start; font-size:12px; letter-spacing:.12em; }
  #hud3d.on { display:flex; }
  #hud3d button { font-family:inherit; font-size:12px; letter-spacing:.1em; color:var(--paper);
    padding:6px 11px; border:1px solid rgba(182,172,147,.4); background:rgba(20,19,15,.6); cursor:pointer; }
  .scene-head { display:flex; align-items:center; flex-wrap:wrap; gap:6px; }
  .scene-head #btn-tools { color:#f2e7d3; border-color:rgba(197,161,92,.5); background:rgba(140,59,46,.38); }
  .scene-note { font-family:var(--sans); font-size:9.5px; letter-spacing:.8px; color:#8fa692; padding-left:4px; }
  .scene-tools { display:none; flex-wrap:wrap; gap:6px; align-items:center; padding:7px;
    border:1px solid rgba(182,172,147,.22); border-radius:5px; background:rgba(16,16,13,.72);
    box-shadow:0 12px 30px rgba(0,0,0,.18); }
  #hud3d.open .scene-tools { display:flex; }
  #hud { position:fixed; top:84px; right:16px; z-index:7; }
  #legend { display:none; flex-wrap:wrap; gap:4px 12px; max-width:min(560px,80vw);
    font-size:11px; letter-spacing:.08em; padding:8px 10px; background:rgba(20,19,15,.55); border:1px solid rgba(182,172,147,.25); border-radius:4px; }
  #legend.on { display:flex; }
  #legend .row { display:flex; align-items:center; gap:7px; }
  #legend .sw { width:12px; height:12px; border-radius:2px; display:inline-block; box-shadow:0 0 0 1px rgba(0,0,0,.3); }
  #meta { display:none; font-size:11px;
    line-height:1.9; color:#cfc4aa; text-align:left; text-shadow:0 1px 4px #000; }
  #meta.on { display:block; }
  #place { display:inline-block; padding:5px 10px; border-radius:4px;
    background:rgba(17,16,13,.62); border:1px solid rgba(182,172,147,.24);
    color:#e7dcc5; font-weight:500; font-size:12px; letter-spacing:.08em;
    text-shadow:0 1px 3px #000; backdrop-filter:blur(5px); }
  #place:empty { display:none; }
  #err { display:none; max-width:min(560px,60vw);
    font-size:12px; line-height:1.8; color:#f4dcd4; background:rgba(90,35,28,.85); padding:10px 14px; border-radius:4px; }

  /* ===== 3D 玩法 UI（游戏3D 引擎 game3d.js 所需；独立一层，不与上面的 3D 渲染样式冲突） ===== */
  .g3d-hud { display:flex; flex-direction:column; gap:6px;
    font-family:"Songti SC","SimSun",serif; }
  .g3d-hud .res { display:flex; align-items:center; gap:8px; background:rgba(20,19,15,.62); border:1px solid rgba(182,172,147,.28);
    border-radius:4px; padding:5px 10px; min-width:152px; }
  .g3d-hud .res-k { font-size:13px; width:1em; text-align:center; }
  .g3d-hud .res-v { font-size:16px; font-variant-numeric:tabular-nums; color:#E6DCC4; min-width:30px; text-align:right; }
  .g3d-hud .res-v.up { color:#9fd6a0; } .g3d-hud .res-v.down { color:#e7a39a; }
  .g3d-hud .res-bar { flex:1; height:5px; background:rgba(0,0,0,.35); border-radius:3px; overflow:hidden; }
  .g3d-hud .res-bar i { display:block; height:100%; }

  .g3d-topbar { display:flex; gap:3px; flex-wrap:wrap; justify-content:flex-end; margin-left:auto;
    max-width:100%; font-family:"Songti SC","SimSun",serif; }
  .g3d-topbar button { font-family:inherit; font-size:12px; letter-spacing:.1em; color:#E6DCC4;
    padding:6px 11px; border:1px solid rgba(182,172,147,.4); background:rgba(20,19,15,.6); cursor:pointer; border-radius:3px; }
  .g3d-topbar button:hover { background:rgba(140,59,46,.55); }

  .g3d-nav { max-width:min(300px,100%);
    background:rgba(20,19,15,.72); border:1px solid rgba(182,172,147,.28); border-radius:6px; padding:12px 14px;
    font-family:"Songti SC","SimSun",serif; color:#E6DCC4; }
  .g3d-nav .nav-cur { display:flex; align-items:baseline; gap:8px; font-size:15px; }
  .g3d-nav .nav-cur b { font-size:18px; }
  .g3d-nav .nav-cur-tip { font-size:11px; color:#b9ae96; }
  .g3d-nav .nav-enter { margin-left:auto; font-family:inherit; font-size:12px; color:#F2ECDA;
    padding:4px 10px; border:1px solid rgba(182,172,147,.4); background:rgba(140,59,46,.5); cursor:pointer; border-radius:3px; }
  .g3d-nav .nav-next { margin-top:10px; font-size:12px; color:#cfc4aa; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .g3d-nav .nav-next-tip { width:100%; color:#b9ae96; }
  .g3d-nav .nav-go { font-family:inherit; font-size:13px; color:#F2ECDA; padding:5px 12px;
    border:1px solid rgba(182,172,147,.45); background:rgba(140,59,46,.32); cursor:pointer; border-radius:3px; }
  .g3d-nav .nav-go:hover { background:rgba(140,59,46,.7); }
  .g3d-nav .dim { color:#8f8776; font-style:italic; }

  .node-hits { position:absolute; inset:0; z-index:4; pointer-events:none; user-select:none; -webkit-user-select:none; }
  .node-hit { position:absolute; transform:translate(-50%,-50%); width:20px; height:20px; border-radius:50%;
    border:2px solid rgba(230,220,196,.85); background:rgba(140,59,46,0); pointer-events:auto; cursor:pointer;
    padding:0; font-size:13px; line-height:1; color:#fff; text-shadow:0 1px 2px #000; }
  .node-hit.reach { background:rgba(140,59,46,.5); box-shadow:0 0 0 3px rgba(214,189,120,.26); animation:nhpulse 1.6s ease-in-out infinite; }
  .node-hit.cur { width:30px; height:30px; border-color:#e6dcc4; background:rgba(214,189,120,.85); color:#17150f; font-size:18px; z-index:2; }
  /* 唯一真正的下一站：金色高亮 + 双层脉冲光环 + “下一站”标签，从一众红点里一眼可辨 */
  .node-hit.next { width:32px; height:32px; border-color:#fff3d6; z-index:3;
    background:radial-gradient(circle at 50% 38%, #fbeec2, #d6bd78 72%);
    box-shadow:0 0 0 5px rgba(214,189,120,.5), 0 0 16px rgba(214,189,120,.55);
    animation:nnext 1.5s ease-in-out infinite; }
  .node-hit.next::after { content:'下一站'; position:absolute; top:-24px; left:50%; transform:translateX(-50%);
    font-family:var(--sans); font-size:11px; letter-spacing:.18em; white-space:nowrap; color:#fff3d6;
    background:rgba(15,14,10,.82); padding:2px 8px; border-radius:10px; text-shadow:0 1px 2px #000; }
  .node-hit.cur::after { content:'你在这里'; position:absolute; top:-24px; left:50%; transform:translateX(-50%);
    font-family:var(--sans); font-size:11px; letter-spacing:.12em; white-space:nowrap; color:#e6dcc4;
    background:rgba(15,14,10,.82); padding:2px 8px; border-radius:10px; text-shadow:0 1px 2px #000; }
  @keyframes nhpulse { 0%,100%{ box-shadow:0 0 0 3px rgba(214,189,120,.30);} 50%{ box-shadow:0 0 0 7px rgba(214,189,120,.10);} }
  @keyframes nnext { 0%,100%{ box-shadow:0 0 0 4px rgba(214,189,120,.45),0 0 12px rgba(214,189,120,.5);} 50%{ box-shadow:0 0 0 9px rgba(214,189,120,.16),0 0 22px rgba(214,189,120,.62);} }

  .g3d-tray { display:flex; flex-wrap:wrap; gap:6px; max-width:min(290px,58vw); justify-content:flex-end; }
  .g3d-tray .chip { font-family:"Songti SC","SimSun",serif; font-size:12px; color:#E6DCC4;
    padding:4px 9px; border:1px solid rgba(182,172,147,.4); background:rgba(20,19,15,.6); border-radius:14px; cursor:pointer; }
  .g3d-tray .chip.comrade { border-color:rgba(214,189,120,.5); }
  .g3d-tray .dim { color:#8f8776; font-style:italic; font-size:11px; }

  .g3d-next { flex:0 0 auto; margin-inline:auto;
    font-family:"Songti SC","SimSun",serif; font-size:14px; letter-spacing:.12em; color:#F2ECDA;
    padding:9px 22px; border:1px solid rgba(214,189,120,.6); background:rgba(140,59,46,.6); cursor:pointer; border-radius:24px; }
  .g3d-next:hover { background:rgba(140,59,46,.9); }
  #next-pill em { font-style:normal; font-size:10px; letter-spacing:2px; opacity:.86; }
  #next-pill em::after { content:' · '; }
  #next-pill b { font-weight:600; }
  #next-pill b::after { content:' ▸'; }

  .g3d-toast { flex:0 0 100%;
    display:flex; flex-direction:column; gap:6px; align-items:center; pointer-events:none; font-family:"Songti SC","SimSun",serif; }
  .g3d-toast .toast-item { background:rgba(20,19,15,.82); color:#ecdfc4; font-size:13px; padding:7px 16px; border-radius:18px;
    border:1px solid rgba(182,172,147,.3); box-shadow:0 4px 14px rgba(0,0,0,.4); transition:opacity .4s, transform .4s; }
  .g3d-toast .toast-item.fade { opacity:0; transform:translateY(-6px); }

  #modal-root { position:absolute; inset:0; z-index:30; pointer-events:none; }
  .modal-wrap { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:20px;
    background:rgba(10,9,6,.62); font-family:"Songti SC","SimSun",serif; pointer-events:auto; }
  .modal-wrap.blocking { background:rgba(10,9,6,.82); }
  .modal { background:#EFE7D2; color:#17150f; width:92%; max-width:680px; max-height:86vh; display:flex; flex-direction:column;
    border-radius:8px; box-shadow:0 18px 60px rgba(0,0,0,.55); overflow:hidden; }
  .modal.wide { max-width:780px; } .modal.mid { max-width:540px; } .modal.sm { max-width:400px; }
  .modal.cinematic { background:linear-gradient(180deg,#F2ECDA,#E4DAC0); }
  .modal-head { padding:16px 22px 10px; border-bottom:1px solid rgba(23,21,15,.12); }
  .modal-head .kicker { display:inline-block; font-size:11px; letter-spacing:.2em; color:#8C3B2E; margin-bottom:4px; }
  .modal-head h3 { margin:0; font-size:21px; font-weight:500; letter-spacing:.04em; }
  .modal-body { padding:14px 22px 18px; overflow:auto; line-height:1.85; font-size:15px; }
  .modal-body p { margin:6px 0; }
  .modal-foot { padding:12px 22px 16px; display:flex; gap:10px; justify-content:flex-end; border-top:1px solid rgba(23,21,15,.1); }
  .mbtn { font-family:inherit; font-size:14px; letter-spacing:.08em; padding:8px 18px; border-radius:4px; cursor:pointer;
    border:1px solid rgba(23,21,15,.3); background:transparent; color:#17150f; }
  .mbtn.primary { background:#8C3B2E; color:#F2ECDA; border-color:#8C3B2E; }
  .mbtn.ghost { border-color:rgba(23,21,15,.25); color:#5a5246; }
  .mbtn:hover { filter:brightness(1.08); }

  /* ===== CG 分镜（移植自 2D style.css：cg-stage / cg-img / cg-weather / 运镜 / 天气粒子） =====
     宣纸+墨+红之外的“电影感”层：全幅 CG 图 + 天气粒子 + 暗角，文字浮在其上。 */
  .modal { position:relative; }
  .modal-wrap.cinematic { background:rgba(8,7,6,.88); }
  .modal.cinematic { background:linear-gradient(180deg,#211d15,#2a241a); color:#F2ECDA;
    border:1px solid rgba(200,186,160,.22); box-shadow:0 24px 80px rgba(0,0,0,.7); }
  .modal.cinematic .modal-head { border-bottom-color:rgba(200,186,160,.18); }
  .modal.cinematic .modal-head h3 { color:#f3e9d6; }
  .modal.cinematic .kicker { color:#d99a86; }
  .modal.cinematic .modal-foot { border-top-color:rgba(200,186,160,.16); }
  /* 只给压在 CG 上的字一层短阴影。原先 6px 的扩大到字缘外，反而像糊了。 */
  .modal.cinematic .modal-head,
  .modal.cinematic .modal-body {
    text-shadow:0 1px 2px rgba(0,0,0,.94), 0 1px 10px rgba(0,0,0,.26); }
  .modal.cinematic .modal-body .cg { color:#f0e6d2; }
  .modal.cinematic .modal-body .cg.big { color:#f6ecd8; }
  .modal.cinematic .modal-body .cg.dim { color:#c9bda6; }
  .modal.cinematic .modal-body .lead { color:#e7dcc6; }
  .modal.cinematic .modal-body .note-hint { background:rgba(140,59,46,.18); color:#dccfb8; border-left-color:#8C3B2E; }
  .modal.cinematic .modal-body .src { color:#a89c86; }
  .modal.cinematic .modal-body .quote { color:#cdbfa8; border-left-color:#b8a06a; }
  .modal.cinematic .modal-body .delta { background:rgba(200,186,160,.1); color:#e3d7bf; }
  .modal.cinematic .modal-body .name-list li { color:#ecdfc4; }
  .modal.cinematic .lore { background:rgba(7,6,5,.52); border-color:rgba(200,186,160,.28); }
  .modal.cinematic .lore-t { color:#eee3cd; }
  .modal.cinematic .lore-where, .modal.cinematic .lore-s { color:#c9bca3; }
  /* 深色剧情弹窗里，纸面弹窗的深色辅助文字必须转浅；否则在 CG 上会发灰发糊。 */
  .modal.cinematic .modal-body .notelist { color:#eee2cb; }
  .modal.cinematic .modal-body .lead { color:#f1e7d4; }
  .modal.cinematic .modal-body .cg.dim { color:#d8ccb6; }
  .modal.cinematic .modal-body .costline,
  .modal.cinematic .modal-body .brief,
  .modal.cinematic .modal-body .mem,
  .modal.cinematic .modal-body .dim,
  .modal.cinematic .modal-body .lore-links,
  .modal.cinematic .modal-body .wall-head,
  .modal.cinematic .modal-body .cardbar-tip,
  .modal.cinematic .modal-body .card-detail p,
  .modal.cinematic .modal-body .wc-places,
  .modal.cinematic .modal-body .lockbox p,
  .modal.cinematic .modal-body .echo { color:#cbbfa6; }
  .modal.cinematic .modal-body .lore-links a { color:#a9ced8; }
  .modal.cinematic .modal-body .delta {
    color:#efe3cd; background:rgba(8,7,6,.44); border-left-color:#bd6a56; }
  .modal.cinematic .modal-body .note-hint {
    color:#f0e2c9; background:rgba(140,59,46,.32); border-left-color:#bd6a56; }
  .modal.cinematic .modal-body .src { color:#c3b69e; }
  .modal.cinematic .modal-body .quote { color:#e5d9c2; border-left-color:#c2aa72; }
  .modal.cinematic .modal-body .card-detail,
  .modal.cinematic .modal-body .wall-card {
    background:rgba(8,7,6,.46); border-color:rgba(200,186,160,.25); }
  .modal.cinematic .modal-body .card-detail h4,
  .modal.cinematic .modal-body .wall-names { color:#efe3cb; }
  .modal.cinematic .modal-body .card-detail .tag { color:#e5a18d; }
  .modal.cinematic .modal-body .sin-tag,
  .modal.cinematic .modal-body .lesson { color:#e8a792; border-color:rgba(232,167,146,.54); }
  .modal.cinematic .modal-body .lockbox { background:rgba(140,59,46,.20); border-color:rgba(205,120,100,.42); }
  .modal.cinematic .modal-body .lockbox b { color:#f1b3a2; }
  .modal.cinematic .modal-body .rule-note {
    color:#d7d9c9; background:rgba(30,45,32,.48); border:1px solid rgba(142,180,146,.34);
    padding:8px 12px; border-radius:2px; }
  .modal.cinematic .modal-body .code-box {
    color:#ecdfc4; background:rgba(8,7,6,.48); border-color:rgba(200,186,160,.30); }
  /* 浅色选项卡、道具卡、史料标题不要把上面的阴影再继承进去，否则黑字会发虚。 */
  .modal.cinematic .modal-body .opt,
  .modal.cinematic .modal-body .opt *,
  .modal.cinematic .modal-body .chip,
  .modal.cinematic .modal-body .chip *,
  .modal.cinematic .modal-body .lore-top,
  .modal.cinematic .modal-body .lore-top *,
  .modal.cinematic .modal-body .code-box { text-shadow:none; }
  .cg-stage { position:absolute; inset:0; overflow:hidden; z-index:0; pointer-events:none; border-radius:8px; }
  .cg-stage.no-art { display:none; }   /* 图没生成或加载失败：只留原来的文字 CG */
  .cg-img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .cg-weather { position:absolute; inset:0; width:100%; height:100%; opacity:.9; }
  .cg-scrim {
    position:absolute; inset:0;
    background:
      linear-gradient(180deg,rgba(8,7,6,.74) 0%,rgba(8,7,6,.52) 34%,rgba(8,7,6,.64) 72%,rgba(8,7,6,.88) 100%),
      radial-gradient(120% 80% at 50% 0%,rgba(8,7,6,.26),transparent 62%);
  }
  .modal-head, .modal-body, .modal-foot { position:relative; z-index:1; }
  @keyframes cg-zoom-in  { from { transform:scale(1.02); } to { transform:scale(1.13); } }
  @keyframes cg-pan-left  { from { transform:scale(1.10) translateX(2.5%); } to { transform:scale(1.10) translateX(-2.5%); } }
  @keyframes cg-pan-right { from { transform:scale(1.10) translateX(-2.5%); } to { transform:scale(1.10) translateX(2.5%); } }
  @keyframes cg-pan-up    { from { transform:scale(1.10) translateY(2%); } to { transform:scale(1.10) translateY(-2%); } }
  @keyframes cg-fade      { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  .cg-stage.motion-zoom-in  .cg-img { animation:cg-zoom-in 12s ease-out forwards; }
  .cg-stage.motion-pan-left .cg-img { animation:cg-pan-left 13s ease-out forwards; }
  .cg-stage.motion-pan-right .cg-img { animation:cg-pan-right 13s ease-out forwards; }
  .cg-stage.motion-pan-up   .cg-img { animation:cg-pan-up 13s ease-out forwards; }
  .modal.cinematic .modal-body > .cg { animation:cg-fade 1.1s ease-out both; }
  .modal.cinematic .modal-body > .cg:nth-child(2) { animation-delay:.35s; }
  .modal.cinematic .modal-body > .cg:nth-child(3) { animation-delay:.7s; }
  @media (prefers-reduced-motion: reduce) {
    .cg-stage .cg-img { animation:none !important; }
    .cg-weather { display:none; }
    .modal.cinematic .modal-body > .cg { animation:none !important; }
  }

  /* 右侧「下一站」导航：唯一推荐项金色高亮，与地图金色点呼应 */
  .g3d-nav .nav-go.rec { background:rgba(214,189,120,.42); border-color:#d6bd78; color:#fff; font-weight:600; }
  .g3d-nav .nav-go .recdot { color:#fff3d6; }

  .modal-body .cg { font-size:18px; line-height:2; color:#3a2f23; margin:6px 0 12px; }
  .modal-body .lead { margin:8px 0; }
  .modal-body .note-hint { font-size:13px; color:#6b6151; background:rgba(140,59,46,.08); border-left:3px solid #8C3B2E;
    padding:8px 12px; border-radius:0 4px 4px 0; margin:10px 0; }
  .modal-body .src { font-size:12px; color:#7a7163; font-style:italic; margin-top:10px; }
  .modal-body .quote { font-size:15px; color:#5a4632; border-left:3px solid #b8a06a; padding-left:12px; margin:10px 0; }
  .modal-body .mem { font-size:13px; color:#5a5246; margin:4px 0; }
  .modal-body .dim { color:#8a8071; font-style:italic; }
  .modal-body .name-list { margin:8px 0; padding-left:20px; columns:2; }
  .modal-body .name-list li { margin:2px 0; }
  .wall-list { display:flex; flex-direction:column; gap:10px; }
  .wall-card { background:rgba(23,21,15,.05); border:1px solid rgba(23,21,15,.12); border-radius:6px; padding:10px 14px; }
  .wall-head { font-size:13px; color:#6b6151; margin-bottom:4px; }
  .wall-names { font-size:14px; }
  .card-list { display:flex; flex-direction:column; gap:8px; }
  .card-detail { background:rgba(23,21,15,.05); border:1px solid rgba(23,21,15,.12); border-radius:6px; padding:9px 13px; }
  .card-detail.used { opacity:.5; }
  .card-detail h4 { margin:0 0 4px; font-size:15px; }
  .card-detail .tag { font-size:11px; color:#8C3B2E; margin-left:8px; }
  .card-detail p { margin:0; font-size:13px; color:#5a5246; }
  .lore-list { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .lore { background:rgba(23,21,15,.05); border:1px solid rgba(23,21,15,.12); border-radius:6px; padding:11px 14px; }
  .lore.locked { opacity:.55; }
  .lore-top { display:flex; align-items:center; gap:8px; }
  .lore-top h4 { margin:0; font-size:15px; }
  .grade { font-size:11px; padding:1px 7px; border-radius:10px; color:#fff; }
  .g-A { background:#3a6b4a; } .g-R { background:#7a5a2e; } .g-q { background:#6b6151; }
  .lore-where { font-size:12px; color:#7a7163; margin:4px 0; }
  .lore-t { font-size:13px; line-height:1.8; }
  .lore-s { font-size:11px; color:#8a8071; margin-top:6px; }
  .code-box { width:100%; height:90px; font-family:monospace; font-size:12px; padding:8px; border:1px solid rgba(23,21,15,.3); border-radius:4px; resize:none; }
  .notelist { margin:8px 0; padding-left:20px; }

  /* ===== 事件关卡：选项 / 附卡 / 违纪标签 / 通用 chip（从 2D style.css 移植，保持宣纸+墨+红一致观感） ===== */
  .opts { display:flex; flex-direction:column; gap:8px; margin:6px 0 14px; }
  .opt { text-align:left; cursor:pointer; background:rgba(255,253,247,.66);
    border:1px solid rgba(122,111,87,.45); border-left:4px solid transparent;
    padding:11px 14px; border-radius:2px; transition:.16s; font-family:var(--serif); }
  .opt:hover { border-left-color:var(--red); background:#fffdf7; transform:translateX(3px); }
  .opt-label { display:block; font-size:16.5px; color:#221f1a; line-height:1.75; }
  .opts.locked .opt { pointer-events:none; cursor:default; }
  .opt.picked { border-left-color:var(--red); background:#fffdf7; box-shadow:inset 0 0 0 1px rgba(168,52,42,.22); }
  .opt.picked .opt-label { font-weight:600; }
  .opt.passed { opacity:.66; }
  .opt-reveal { display:block; margin-top:6px; font-family:var(--sans); font-size:12.5px; letter-spacing:.6px;
    color:#6d6350; animation:reveal-in .34s ease-out; }
  .opt.picked .opt-reveal { color:var(--red); font-weight:700; }
  @keyframes reveal-in { from { opacity:0; transform:translateY(-4px); } }
  .reveal-tip { display:block; margin-top:10px; font-family:var(--sans); font-size:11px; letter-spacing:2.5px;
    color:#9a8f79; text-align:right; animation:reveal-in .5s ease-out; }
  .sin-tag { display:inline-block; margin-top:6px; font-family:var(--sans); font-size:10.5px; letter-spacing:2px;
    color:#7c2f22; border:1px dashed rgba(124,47,34,.55); padding:2px 7px; border-radius:2px; }
  .lesson { display:block; margin-top:6px; font-family:var(--sans); font-size:11.5px; color:var(--warn); }
  .cardbar { border-top:1px dashed rgba(122,111,87,.4); padding-top:12px; }
  .cardbar.locked { opacity:.4; pointer-events:none; }
  .cardbar-tip { font-family:var(--sans); font-size:11.5px; color:#7b7261; display:block; margin-bottom:8px; letter-spacing:1px; }
  #pick-card { display:flex; gap:6px; flex-wrap:wrap; }
  .costline { font-family:var(--sans); font-size:12px; color:#5f594c; letter-spacing:1px; }
  .delta { margin:10px 0 4px; padding:8px 12px; font-family:var(--sans); font-size:13px; letter-spacing:1px;
    color:#3a352c; background:rgba(122,111,87,.09); border-left:3px solid var(--red); border-radius:2px; }

  /* 通用卡片 chip：事件弹窗内 #pick-card .chip.tiny、手法卡面板等。
     注：HUD 托盘里的 chip 由上方 .g3d-tray .chip 接管（特异性更高），不受此处影响。 */
  .chip { font-family:var(--serif); cursor:pointer; text-align:left;
    background:rgba(238,230,212,.94); border:1px solid #6f675a; border-left:4px solid var(--red);
    border-radius:2px; padding:5px 9px; line-height:1.15; transition:.16s; }
  .chip b { display:block; font-size:13px; color:#221f1a; }
  .chip i { display:block; font-family:var(--sans); font-size:10px; color:#6e6656; font-style:normal; }
  .chip:hover { transform:translateY(-2px); box-shadow:0 6px 14px rgba(0,0,0,.4); }
  .chip[disabled] { opacity:.42; cursor:default; transform:none; }
  .chip.comrade { border-left-color:var(--river); }
  .chip.tiny { padding:4px 8px; }
  .chip.tiny.on { background:var(--red); border-color:var(--red); }
  .chip.tiny.on b { color:#fff; }
  .chip.school-机动 { border-left-color:var(--river); }
  .chip.school-战斗 { border-left-color:#6d3a2f; }
  .chip.school-团结 { border-left-color:var(--grass); }
  .chip.school-坚韧 { border-left-color:var(--gold); }

  /* 进入 3D 视图前，隐藏全部玩法 UI，避免覆盖封面、拦截“进入 3D 视图”按钮的点击。
     VoxelMap.init 成功后由 JS 给 <body> 加上 .entered，再淡入显示。 */
  #hud, #hand-tray, #comrade-tray, #g3d-topbar, #next-pill, .g3d-brandbar, #nav-menu, #cam-reset {
    opacity:0; visibility:hidden; pointer-events:none; transition:opacity .35s ease; }
  body.entered #hud, body.entered #hand-tray, body.entered #comrade-tray,
  body.entered #g3d-topbar, body.entered #next-pill, body.entered .g3d-brandbar,
  body.entered #nav-menu, body.entered #cam-reset {
    opacity:1; visibility:visible; pointer-events:auto; }

  /* 手机端只留一个「菜单」入口：其余功能收进底部抽屉，桌面完全不出现这些元素。 */
  #nav-menu, #cam-reset, #menu-scrim, .menu-sheet-title { display:none; }
  #nav-view, #nav-comrades, #nav-2d, #nav-home { display:none; }
  .g3d-scrim { position:fixed; inset:0; z-index:44; background:rgba(8,7,5,.58);
    pointer-events:auto; -webkit-tap-highlight-color:transparent; }
  #menu-scrim.on { display:block; }
  .g3d-scrim.on { display:block; }
  #nav-menu {
    align-items:center; justify-content:center; gap:4px; min-width:58px; height:44px;
    padding:0 9px; border:1px solid rgba(214,189,120,.55); border-radius:10px;
    background:rgba(20,19,15,.82); color:#f3e7ce; font:600 12px/1 var(--sans);
    letter-spacing:1px; cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  #nav-menu::before { content:'☰'; font-size:16px; line-height:1; }
  #nav-menu:active, #nav-menu[aria-expanded="true"] { background:rgba(140,59,46,.86); border-color:#d6bd78; }
  .menu-sheet-title { grid-column:1/-1; align-items:center; justify-content:space-between;
    padding:1px 2px 3px; color:#d8cbb0; font:600 12px/1.4 var(--sans); letter-spacing:2px; }
  .menu-sheet-title small { color:#8f8776; font-weight:400; letter-spacing:1px; }

  /* 窄屏（断点跟 2D 页一致）：字号与内边距先收紧，让每条带尽量只占一两行。
     手机横屏宽度常超过 760，但高度只有三百多：用「粗指针 + 矮视口」也算手机。 */
  @media (max-width:760px), (pointer:coarse) and (max-height:520px) {
    /* 窄屏顶带改成三行网格：品牌 / 视图工具 + 功能导航 / 四资源。
       资源条不再用固定 top 钉住，导航和资源各占一行，互不遮挡。 */
    #ui-top {
      top:8px; left:8px; right:8px; gap:6px;
      display:grid; grid-template-columns:minmax(0,1fr) auto;
      grid-template-areas:
        "hud menu"
        "toast toast";
      align-items:start; flex-wrap:nowrap; overflow:visible;
    }
    #ui-top-l { display:contents; }
    .g3d-brandbar { display:none; }
    #nav-menu { grid-area:menu; display:inline-flex; }
    #hud3d { display:none; }
    #hud3d.on:not(.open) { display:none; }
    #g3d-topbar {
      position:fixed; left:8px; right:8px; z-index:45;
      bottom:calc(10px + env(safe-area-inset-bottom));
      display:none; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px;
      width:auto; min-width:0; margin:0; padding:10px;
      border:1px solid rgba(182,172,147,.4); border-radius:12px;
      background:linear-gradient(180deg,rgba(28,26,20,.98),rgba(16,15,12,.98));
      box-shadow:0 18px 48px rgba(0,0,0,.55); font-family:var(--serif);
    }
    #g3d-topbar.open { display:grid; }
    #g3d-topbar .menu-sheet-title { display:flex; }
    #g3d-topbar #nav-view, #g3d-topbar #nav-comrades,
    #g3d-topbar #nav-2d, #g3d-topbar #nav-home { display:grid; }
    #hud {
      grid-area:hud; position:static; inset:auto; width:auto; min-width:0;
      display:grid; grid-template-columns:repeat(4,minmax(0,1fr));
      gap:4px; padding:5px 6px;
    }
    #hud .res { min-width:0; width:auto; gap:5px; padding:4px 6px; }
    #hud .res-k { font-size:12px; }
    #hud .res-v { min-width:24px; font-size:14px; }
    #legend { display:none; position:fixed; left:8px; right:8px; top:66px; z-index:20; max-width:none; }
    #legend.on { display:flex; }
    #meta { display:none !important; }
    #toast { grid-area:toast; max-width:100%; }

    #hud3d button, #g3d-topbar button, #g3d-topbar a { font-size:12px; min-height:44px; padding:6px 8px; }
    #g3d-topbar button, #g3d-topbar a { white-space:nowrap; border-radius:8px; }
    #g3d-topbar button { letter-spacing:1px; }
    #g3d-topbar a { display:grid; place-items:center; color:#E6DCC4; text-decoration:none;
      border:1px solid rgba(182,172,147,.4); background:rgba(20,19,15,.6); }
    #g3d-topbar #reset-btn { color:#f0b8aa; border-color:rgba(214,120,100,.5); }
    /* 视角/画质面板：从菜单点进来，底栏抽屉式弹出，不再常驻右上角 */
    #hud3d.on.open {
      display:flex; position:fixed; left:8px; right:8px; z-index:46;
      bottom:calc(10px + env(safe-area-inset-bottom));
      max-height:72vh; overflow:auto; padding:10px;
      border:1px solid rgba(182,172,147,.4); border-radius:12px;
      background:linear-gradient(180deg,rgba(28,26,20,.98),rgba(16,15,12,.98));
      box-shadow:0 18px 48px rgba(0,0,0,.55);
    }
    #hud3d .scene-head { width:100%; justify-content:space-between; }
    #hud3d #btn-tools { display:none; }
    #hud3d .scene-note { display:block; font-size:10px; padding-left:0; }
    #hud3d.on.open .scene-tools { display:grid; grid-template-columns:1fr 1fr; gap:8px; width:100%; }
    #scene-tools select { grid-column:1/-1; width:100%; min-height:42px; }
    #place { display:none; }

    /* 底部只留「当前地点 + 下一站」。手牌/战友改由菜单进入，
       把纵向空间还给地图；下一站按钮直接写出目的地，不用再猜。 */
    #ui-bottom {
      left:8px; right:8px; bottom:calc(10px + env(safe-area-inset-bottom)); gap:8px;
      display:grid; grid-template-columns:minmax(0,1fr) auto;
      grid-template-areas:"nav next";
      align-items:end; flex-wrap:nowrap; overflow:visible;
    }
    #ui-bottom-l { grid-area:nav; min-width:0; width:100%; align-items:stretch; }
    #g3d-nav-slot { min-width:0; }
    .g3d-nav { width:100%; max-width:100%; padding:8px 10px; }
    .g3d-nav .nav-cur { flex-wrap:wrap; gap:5px 8px; font-size:14px; }
    .g3d-nav .nav-cur b { font-size:16px; }
    .g3d-nav .nav-cur-tip { display:none; }
    .g3d-nav .nav-next { display:none; }
    .g3d-nav .nav-enter { min-height:38px; padding:5px 10px; }
    #next-pill { grid-area:next; align-self:stretch; margin:0; padding:7px 14px;
      min-height:48px; font-size:13px; white-space:nowrap; border-radius:26px;
      max-width:60vw; overflow:hidden; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:1px; line-height:1.15; }
    #next-pill em::after { content:none; }
    #next-pill b::after { content:none; }
    #next-pill b { max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #next-pill:disabled { opacity:.55; cursor:default; }
    #ui-bottom-r { display:none; }
    #cam-reset { display:flex; }

    /* 可点热区放大：手指不必精确戳 20px 的点。 */
    .node-hit { width:34px; height:34px; border-width:2px; font-size:15px; touch-action:manipulation; }
    .node-hit.reach { width:38px; height:38px; }
    .node-hit.cur { width:44px; height:44px; font-size:22px; }
    .node-hit.next { width:46px; height:46px; }
    .node-hit.next::after { top:-26px; font-size:12px; }
    .node-hit.cur::after { top:-26px; font-size:12px; }

    /* 剧情弹窗窄屏：史料从双栏改单栏，避免 95px 宽的细长字列。 */
    .lore-list { grid-template-columns:1fr; }
    .modal-body .name-list { columns:1; }
    .modal-head { padding:14px 16px 8px; }
    .modal-head h3 { font-size:19px; }
    .modal-body { padding:14px 16px 10px; }
    .modal-foot { padding:10px 16px 16px; }
    .mbtn { min-height:44px; }
    .opt { min-height:48px; }
  }
  /* 手机：两条带各收成一行横向滑 —— 宁可划一下，也别把控件摞满整屏、把地图挤没 */
  @media (max-width:430px) {
    #ui-bottom-l, #ui-bottom-r, .g3d-hud, .g3d-brandbar { flex:0 0 auto; }
    #ui-bottom { touch-action:pan-x; }
    #hud .res-bar { display:none; }
    #hud .res { justify-content:center; }
    .g3d-nav .nav-go { padding:5px 9px; font-size:12px; }
    #meta { white-space:nowrap; }
  }

  /* ---------- 触屏移动盘（Minecraft 式双拇指）----------
     左下：前后左右；右下：上升/下降；双指捏合只缩放。
     只在粗指针设备、进入 3D 后出现；键鼠桌面完全不显示。 */
  #touch-pad {
    position:fixed; inset:0; z-index:9; display:none;
    pointer-events:none; touch-action:none;
    user-select:none; -webkit-user-select:none;
  }
  @media (pointer:coarse) { body.entered #touch-pad { display:block; } }
  #move-pad {
    position:absolute; left:12px; bottom:calc(104px + env(safe-area-inset-bottom));
    width:150px; height:150px; display:grid;
    grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);
    gap:6px; pointer-events:auto;
  }
  #move-pad [data-k="w"] { grid-area:1/2; }
  #move-pad [data-k="a"] { grid-area:2/1; }
  #cam-reset { grid-area:2/2; }

  const sx = (x1 - x0) / (nx - 1), sz = (z1 - z0) / (nz - 1);
  const H = new Float32Array(nx * nz);
  for (let j = 0; j < nz; j++) for (let i = 0; i < nx; i++) {
    const X = x0 + i * sx, Z = z0 + j * sz;
    /* 低频起伏掺进地表：草地不是一块规整的碗，水位面因此长出不规则的边和岛 */
    const wob = (vn(X * .021 + 7.7, Z * .021 - 3.3) - .5) * 0.7;
    H[j * nx + i] = Math.max(1.5, surfaceY(X, Z) + wob);
  }
  /* ---------- 2. 水位面 ----------
     沼泽的水不是「填满每个洼地」，而是一层高水位的浅水躺在平坦的洼地里。
     所以水位面取地表的低频轮廓（模糊），但必须同时满足两件事才成水：
       (1) 地面低于水位面；
       (2) 这片地是平的 —— 坡地上水位面会横切山腰，就是截图里那些悬在半坡的灰条纹。
     水位面还要在草地边界五个格内渐隐到地面，否则盒子边界会被水切出一道直线。 */
  const boxBlur = (src, rad, pass) => {
    let cur = src;
    for (let p = 0; p < pass; p++) {
      const t1 = new Float32Array(cur.length);
      for (let j = 0; j < nz; j++) for (let i = 0; i < nx; i++) {
        let s = 0, c = 0;
        for (let k = -rad; k <= rad; k++) { const ii = i + k; if (ii < 0 || ii >= nx) continue; s += cur[j * nx + ii]; c++; }
        t1[j * nx + i] = s / c;
      }
      const t2 = new Float32Array(cur.length);
      for (let j = 0; j < nz; j++) for (let i = 0; i < nx; i++) {
        let s = 0, c = 0;
        for (let k = -rad; k <= rad; k++) { const jj = j + k; if (jj < 0 || jj >= nz) continue; s += t1[jj * nx + i]; c++; }
        t2[j * nx + i] = s / c;
      }
      cur = t2;
    }
    return cur;
  };
  const LOW = boxBlur(H, 9, 3);

     写死常数做不到（地形一变就全干或全淹）：阈值太高只剩几条细沟，太低整片泡汤。 */
  const dd = new Float32Array(LOW.length);
  for (let k = 0; k < dd.length; k++) dd[k] = LOW[k] - H[k];
  const srt = Array.from(dd).sort((a, c) => a - c);
  const kick = srt[Math.min(srt.length - 1, Math.floor(srt.length * 0.30))];
  const LVL = new Float32Array(LOW.length);
  /* 区域坡度（用低频面算，避免细碎噪声把平地判成坡）：陡的地方不给水 */

  for (let j = 0; j < nz; j++) for (let i = 0; i < nx; i++) {

    const jl = Math.max(0, j - 1), jr = Math.min(nz - 1, j + 1);

    SLOPE[k] = Math.hypot(gx2, gz2);

  for (let j = 0; j < nz; j++) for (let i = 0; i < nx; i++) {

    const e = Math.min(i, nx - 1 - i, j, nz - 1 - j);

       草地是缓坡丘陵，阈值放宽很多，缓坡上照常有水 —— 否则整片草地被误判成"陡"而干涸。 */

       整片平铺到底的水面不像沼泽，像一张灰塑料布。用两段中频噪声在水位面上压出
       成片的草洲/浅滩：压得狠的地方地面探出水面，成为草甸和泥洲；压得浅的地方还是水，
       于是"水—草—水"交错，才是若尔盖的样子。

    const X = x0 + i * sx, Z = z0 + j * sz;

      + vn(X * .121 - 3.7, Z * .121 + 9.2) * .38 - .56) / .15, 0, 1);

    const tx = clamp(fx - i, 0, 1), tz = clamp(fz - j, 0, 1);

    const c1 = LVL[(j + 1) * nx + i], d1 = LVL[(j + 1) * nx + i + 1];
    return lerp(lerp(a1, b1, tx), lerp(c1, d1, tx), tz);

  const nearNode = (X, Z, r) => (NODES3D || []).some(nd => Math.hypot(X - nd.x, Z - nd.z) < r);
  /* 河带自己会画水，草地的水面绕开它，免得两层水叠在一起又变成"锡纸"。
     只判格心一处：河带本身已经够宽（两岸各留了河滩），多探几格会把草地水面切成一堆孤岛。 */

     旧写法把快没过水面的角点压到 h-.30，于是细网格下成千上万个岸线角点各自跟着

     地形戳出水面的部分不整格剔除，交给不透明地面的深度遮挡自然盖住（草墩/泥岛因此

  }

  /* ---------- 4. 草墩：水边、浅滩，深水里也稀稀地冒几丛（塔头） ---------- */
  vreset();
  for (let Z = z0; Z < z1; Z += 2.9) for (let X = x0; X < x1; X += 2.9) {
    const px = X + (rnd() - .5) * 2.7, pz = Z + (rnd() - .5) * 2.7;
    if (nearNode(px, pz, 12) || inRiver(px, pz)) continue;
    const gy = surfaceY(px, pz), lv = lvlAt(px, pz);
    const d = lv - gy;                       /* >0：在水下；<0：地面露出水面 */
    if (d < -2.2) continue;                  /* 坡上太干了，不长 */
    /* 越长越稀，但深水里也要有 —— 沼泽的草是从水里冒出来的（塔头草墩）。
       只长在岸线附近的话，水面中间就是一整张灰布，没有尺度也没有生机。 */
    const p = d <= 0 ? .30 : clamp(.44 - d * .11, .10, .44);
    if (rnd() > p) continue;
    const top = Math.max(gy + .35, lv + .14 + rnd() * .5);    /* 墩顶探出水面一点 */
    const w = .42 + rnd() * .38;
    /* 深水里的墩脚收细、从水面附近起 —— 是"塔头"，不是一根从湖底立上来的方柱 */
    const bw = d > .8 ? w * .48 : w;
    const by = d > .8 ? lv - .45 : gy - .35;
    vhbox(px - bw, by, pz - bw, px + bw, top, pz + bw,
      [.30 + .06 * rnd(), .28 + .05 * rnd(), .17], .9);
    if (rnd() < (d > .8 ? .85 : .55)) {       /* 墩上一撮草：草地不是一片灰绿的泥 */
      const hh = .35 + rnd() * .55;
      vhbox(px - w * .7, top - .05, pz - w * .7, px + w * .7, top + hh, pz + w * .7,
        [.42 + .14 * rnd(), .47 + .12 * rnd(), .22 + .06 * rnd()], .9);
    }
    if (rnd() < .22) {                        /* 稀稀几丛芦苇，给水面一个尺度 */
      const ry = Math.max(gy - .1, lv - .6);
      for (let k = 0; k < 3; k++) {
        const ax = px + (rnd() - .5) * 1.8, az = pz + (rnd() - .5) * 1.8;
        vhbox(ax - .07, ry, az - .07, ax + .07, lv + .8 + rnd() * .7, az + .07,
          [.40, .42, .25], .9);
      }
    }
  }
  /* ---------- 4b. 草甸片：草洲、浅滩、水线上下铺一层矮草皮 ----------
     只靠零散草墩（每丛不到一平米）撑不起"水里有草"的观感，远看还是泥滩。
     沿水线铺扁平的草皮块：出水处是绿的草洲，没在水下的那半边被半透明水染成暗绿，
     于是水面中间长出成片的草 —— 这正是沼泽"水草交错"的肌理。 */
  for (let Z = z0; Z < z1; Z += 3.0) for (let X = x0; X < x1; X += 3.0) {
    const px = X + (rnd() - .5) * 2.6, pz = Z + (rnd() - .5) * 2.6;
    if (nearNode(px, pz, 12) || inRiver(px, pz)) continue;
    const gy = surfaceY(px, pz), lv = lvlAt(px, pz);
    const d = lv - gy;
    if (d > .45 || d < -1.5) continue;        /* 只铺水线上下这一带 */
    if (rnd() > .58) continue;                /* 留出空隙：水要能连成片，草是洲不是毯 */
    const w = .85 + rnd() * .65;
    const y0 = Math.min(gy, lv - .07) - .1;
    const y1 = Math.max(gy + .1, lv + (rnd() < .35 ? .14 : -.1));
    vhbox(px - w, y0, pz - w, px + w, y1, pz + w,
      [.29 + .07 * rnd(), .40 + .09 * rnd(), .16 + .05 * rnd()], .92);
  }
  const tuft = { data: V.slice(0, VW), count: vCount };
  clrXF();
  return { water, tuft };
}

/* 南方梯田：几道弧形田埂。每一节都按自己脚下的地表高度落，坡上才不会浮起来 */

               [px + .75, g1 + .05, pz + .38], [px - .75, g0 + .05, pz + .38], c, [0, 1, 0]);
      /* 朝坡下的一侧补一道土坎，坡下方不留缝 */

/* 沿线地域植被：沿路线每隔约 20 世界单位，按所在地段种本地树 */
function buildVegetation() {
  clrXF(); vreset(); let acc = 0;
  for (let k = 1; k < ROUTE.length; k++) {
    const a = ROUTE[k - 1], b = ROUTE[k]; acc += Math.hypot(b[0] - a[0], b[1] - a[1]);
    if (acc < 20) continue; acc = 0;
    const treeType = pickTreeType(b[0], b[1]);
    const dx = b[0] - a[0], dz = b[1] - a[1], L = Math.hypot(dx, dz) || 1, nx = -dz / L, nz = dx / L;
    for (const side of [-1, 1]) if (RNG() < 0.6) {
      const off = 8 + RNG() * 22, x = b[0] + nx * off * side, z = b[1] + nz * off * side;
      vhtree(treeType, x, surfaceY(x, z), z, 1.0 + RNG() * 0.6);
    }
  }
  /* 聚落外圈的生活 / 军事小件：按地域挑，别一路同一种，也别压到房子上 */
  for (const nd of NODES3D) {
    const rk = regionByWorld(nd.x, nd.z), ic = nd.icon || '';
    const battle = (ic === 'battle' || ic === 'river' || ic === 'pass' || ic === 'checkpoint');
    const nItem = 3 + (RNG() * 3 | 0);
    for (let k = 0; k < nItem; k++) {
      const a = RNG() * 6.283, r = 26 + RNG() * 22;
      const x = nd.x + Math.cos(a) * r, z = nd.z + Math.sin(a) * r;
      if (waterAt(x, z)) continue;
      const y = surfaceY(x, z), p = RNG();
      if (battle && p < .30) vhbunker(x, y, z, a);
      else if (rk === 'chuan' || rk === 'min') {
        if (p < .34) vhprayer(x, y, z);
        else if (p < .62) vhcairn(x, y, z);
        else if (p < .82) vhgrave(x, y, z);
        else vhanimal(x, y, z, a);
      } else if (p < .18) vhwell(x, y, z);
      else if (p < .34) vhmill(x, y, z);
      else if (p < .50) vhgrave(x, y, z);
      else if (p < .66) vhanimal(x, y, z, a);
      else if (p < .86) vhfield(x, y, z, 3 + RNG()*3, 2 + RNG()*2,
        rk === 'gan' || rk === 'xiang' || rk === 'qian');
      else vhcairn(x, y, z);
    }
    /* 一个村子常有一处公共建筑：赣南湘桂的祠堂与牌坊、黔北的梯田 */
    const pa = RNG()*6.283, pr = 30 + RNG()*14;
    const bx = nd.x+Math.cos(pa)*pr, bz = nd.z+Math.sin(pa)*pr;
    if (!waterAt(bx,bz)) {
      const by = surfaceY(bx,bz), q = RNG();
      if (rk === 'gan' || rk === 'xiang')
        (q < .48 ? vhancestral : vharchway)(bx, by, bz, pa+1.57);
      else if (rk === 'qian' && q < .58) vhterrace(bx, by, bz, pa);
      else if (q < .48) vharchway(bx, by, bz, pa+1.57);
      else if (rk === 'shaan' || rk === 'min') vhcairn(bx, by, bz);
    }
  }
  /* 水边：垂柳、竹筏、小码头，沿河稀疏点缀 */
  for (const rv of RIVER_W) {
    const pts = rv.fine || rv.pts;
    for (let i = 4; i < pts.length - 4; i += 14) {
      const p = pts[i], q = pts[Math.min(pts.length-1, i+1)];
      let dx = q[0]-p[0], dz = q[1]-p[1]; const L = Math.hypot(dx,dz)||1; dx/=L; dz/=L;
      const nx = -dz, nz = dx, off = riverHW(rv) + riverBW(rv)*.75;
      riverNear(p[0], p[1], rv);
      const wy = waterLevelAt(p[0], p[1]) || RN_W;
      const t = RNG();
      if (t < .55) {
        const x = p[0]+nx*off, z = p[1]+nz*off;
        vhtree('willow', x, surfaceY(x,z), z, .8+RNG()*.4);
      } else if (t < .80) {
        vhraft(p[0]+nx*(off-4), wy+.12, p[1]+nz*(off-4), Math.atan2(dz,dx));
      } else {
        vhpier(p[0]+nx*(off-2), wy+.2, p[1]+nz*(off-2), Math.atan2(dz,dx));
      }
      /* 小溪才随便架桥；大江上不凭空造桥，只在事件地标处有 */
      const bw = riverHW(rv)*2 + riverBW(rv)*.7;
      if (rv.w < 5 && i % 28 === 6) {
        (RNG() < .45 ? vhlogbridge : vhtimberbridge)(p[0], wy+.4, p[1], Math.atan2(nz,nx), bw);
      } else if (rv.w >= 5 && rv.w < 7 && i % 34 === 8 && RNG() < .5) {
        vhstonebridge(p[0], wy+.4, p[1], Math.atan2(nz,nx), bw);
      }

        const wx2 = p[0]+nx*(off+2), wz2 = p[1]+nz*(off+2);
        vhwaterwheel(wx2, surfaceY(wx2,wz2), wz2, Math.atan2(nz,nx));
      }
    }
  }
  clrXF();
  return { data: V.slice(0, VW), count: vCount };
}

/* ================================================================
   战场遗迹：湘江、大渡河、娄山关、腊子口不是村镇，
   是焦土、弹坑、战壕、断墙、没散尽的硝烟和还在烧的火。
   纯体素 box / quad，不画人、不写文字。
   ================================================================ */
/* 硝烟：单独一份网格，frame 里开混合叠上去（不写深度）。
   一整根实心方柱会像石头柱子 —— 烟必须是半透明、碎散、被风斜吹的。 */
function buildSmokeField(n, gy, rot, BS, seed, sc) {
  clrXF();
  const rnd = mulberry32(seed + 777);
  const R = (a, b) => a + (b - a) * rnd();
  const tx = Math.cos(rot), tz = Math.sin(rot), nx = -tz, nz = tx;
  const at = (u, v) => {
    const q = [n.x + tx * u + nx * v, n.z + tz * u + nz * v];
    const dd = Math.hypot(q[0] - n.x, q[1] - n.z);
    if (dd < 19 && dd > .01) { const s = (19 - dd) / dd; q[0] += (q[0] - n.x) * s; q[1] += (q[1] - n.z) * s; }
    return q;
  };
  const ground = (x, z) => surfaceY(x, z) + .10;
  for (let c = 0, M = Math.round(4 * sc); c < M; c++) {
    const q = at(R(-26, 30), R(-18, 18)), y0 = ground(q[0], q[1]) + 2;
    const h = R(20, 34), w = R(1.0, 1.9);
    for (let k = 0; k < 12; k++) {
      const f = k / 12, r = w * (.55 + f * 1.9);
      const cx = q[0] + f * f * 17 + Math.sin(seed + k * 1.3 + c) * 2.2;
      const cz = q[1] + f * 4.5 + Math.cos(seed + k * .9 + c) * 2.2;
      const cy = y0 + f * h;
      const g = lerp(.34, .58, f);
      for (let m = 0; m < 3; m++) {
        const ox = Math.sin(seed + k * 2.1 + m * 2.4 + c) * r * .85;
        const oz = Math.cos(seed + k * 1.7 + m * 1.9 + c) * r * .85;
        vhbox(cx + ox - r * .6, cy, cz + oz - r * .6,
              cx + ox + r * .6, cy + h / 12 * 1.6, cz + oz + r * .6,
              [g * .96, g * .98, g * 1.0], .9);
      }
    }
  }
}
function vhfire(x, y, z, s) {
  /* 火光在昏天黑地里要看得见：亮芯 + 被照红的一圈地面（贴地铺，坡上不悬空） */
  drapeQuad(x, z, 1.8 * s, 1.8 * s, .05, [.50, .19, .07], 1);
  vhbox(x - .55 * s, y, z - .55 * s, x + .55 * s, y + 1.5 * s, z + .55 * s, [.85, .26, .07], .95);
  vhbox(x - .30 * s, y + 1.1 * s, z - .30 * s, x + .30 * s, y + 2.9 * s, z + .30 * s, [1.0, .58, .14], .95);
  vhbox(x - .14 * s, y + 2.4 * s, z - .14 * s, x + .14 * s, y + 3.9 * s, z + .14 * s, [1.0, .78, .32], .95);
}
function buildBattlefield(n, gy, rot, BS, seed, sc) {
  clrXF();
  const rnd = mulberry32(seed);
  const R = (a, b) => a + (b - a) * rnd();
  const tx = Math.cos(rot), tz = Math.sin(rot), nx = -tz, nz = tx;
  /* 战场元素不能落到河道里（否则焦土漂在江面上），也不能压在聚落上 */
  const at = (u, v) => {
    let q = [n.x + tx * u + nx * v, n.z + tz * u + nz * v];
    for (let k = 0; k < 5 && waterAt(q[0], q[1]); k++) { q[0] += nx * 7; q[1] += nz * 7; }
    const dd = Math.hypot(q[0] - n.x, q[1] - n.z);
    if (dd < 21) {
      const s = dd > .01 ? (21 - dd) / dd : 0;
      if (dd > .01) { q[0] += (q[0] - n.x) * s; q[1] += (q[1] - n.z) * s; }
      else { q[0] += 21; }
    }
    return q;
  };
  const ground = (x, z) => surfaceY(x, z) + .10;
  /* 焦土：沿阵地铺不规则黑褐斑 */
  for (let i = 0, M = Math.round(34 * sc); i < M; i++) {
    const q = at(R(-38, 38), R(-26, 26));
    const w = R(2.0, 6.5), d = R(1.6, 5.2), g = R(.12, .21);
    drapeQuad(q[0], q[1], w, d, .05, [g * 1.06, g * .90, g * .78], 2);
  }
  /* 弹坑：暗心 + 翻出的湿土边缘 */

    const q = at(R(-30, 34), R(-22, 22)), y = ground(q[0], q[1]) + .03, rr = R(2.2, 4.6);
    drapeQuad(q[0], q[1], rr, rr, .04, [.13, .11, .10], 2);
    vhbox(q[0] - rr - .5, y, q[1] - rr - .5, q[0] - rr + .2, y + .7, q[1] + rr + .5, [.33, .27, .21], .9);
    vhbox(q[0] + rr - .2, y, q[1] - rr - .5, q[0] + rr + .5, y + .7, q[1] + rr + .5, [.33, .27, .21], .9);
  }
  /* 战壕：折线矮土墙，一节节堆出来像刚挖的 */
  for (let k = 0, M = Math.round(5 * sc); k < M; k++) {
    const u0 = -30 + k * 14, v0 = (k % 2 ? 1 : -1) * R(8, 20);
    const a = at(u0, v0), b = at(u0 + R(9, 14), v0 + R(-6, 6));
    const ya = ground(a[0], a[1]), yb = ground(b[0], b[1]);
    for (let m = 0; m < 6; m++) {
      const x = lerp(a[0], b[0], m / 6), z = lerp(a[1], b[1], m / 6);
      const y = lerp(ya, yb, m / 6);
      vhbox(x - 1.5, y, z - 1.5, x + 1.5, y + R(1.0, 1.8), z + 1.5, [.24, .20, .16], .9);
    }
  }
  /* 断壁残垣：参差半截墙 + 焦木梁 */
  for (let k = 0, M = Math.round(3 * sc); k < M; k++) {
    const q = at(R(-26, 30), R(-20, 20)), y = ground(q[0], q[1]);
    const w = R(4, 7), d = R(3, 5);
    vhbox(q[0] - w / 2, y, q[1] - d / 2, q[0] - w / 2 + .7, y + R(2.2, 4.4), q[1] + d / 2, [.31, .28, .25], .9);
    vhbox(q[0] - w / 2, y, q[1] - d / 2, q[0] + w / 2, y + R(1.4, 2.8), q[1] - d / 2 + .7, [.29, .26, .23], .9);
    vhbox(q[0] - w / 2, y + 2.2, q[1] - d / 2, q[0] + w / 2, y + 2.5, q[1] - d / 2 + .35, [.20, .15, .12], .9);
  }
  /* 火光（硝烟是另一份半透明网格，见 buildSmokeField） */
  for (let k = 0, M = Math.round(5 * sc); k < M; k++) {
    const q = at(R(-28, 32), R(-20, 20)), y = ground(q[0], q[1]);
    vhfire(q[0], y, q[1], R(.8, 1.5));
  }
  /* 残破红旗：斜杆 + 撕开的旗片 */
  if (sc > .8) {

    vhbox(q[0] + .12, y + 5.0, q[1] - .10, q[0] + 3.2, y + 7.2, q[1] + .10, [.60, .13, .11], .95);
    vhbox(q[0] + .12, y + 4.2, q[1] - .10, q[0] + 2.1, y + 5.4, q[1] + .10, [.48, .11, .10], .95);
  }
}
